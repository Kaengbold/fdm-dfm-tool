# Detection thresholds. Every number names the research rule it comes from
# (research/sourced_*.yaml, ids in brackets). Change numbers here, not in code.
# Sizes ending in _nozzle are multiples of the nozzle diameter.

features:
  vanish_below_nozzle: 0.75       # features narrower than this don't print at all [min_wall_thickness_and_arachne: min_arachne]
  rough_below_nozzle: 1.5         # positive features narrower than this print partially / rough [min_wall_thickness_and_arachne, text_embossing_debossing_limits]
  single_wall_below_nozzle: 2.0   # walls thinner than this get only one perimeter -> weak [min_wall_thickness_and_arachne]
  single_wall_min_height_mm: 5    # only report single-perimeter walls that stand at least this tall

use_heat:
  # Warned when the part is used this close to (or above) the material's heat limit (presets heat_limit_c).
  warn_within_c: 15

relief:
  # Raised (embossed) or sunk (engraved) text and details on faces that point up when printed: the
  # slicer cuts the part once per layer, so a step of one layer or less may vanish, and under 0.4 mm /
  # 2 layers it reads faintly. Top-face text depth 0.4–0.6 mm (2–3 layers at 0.2 mm) [text_embossing_debossing_limits].
  min_mm: 0.4             # and at least min_layers layers
  min_layers: 2
  vanish_layers: 1.5      # below this many layers it may not print at all
  max_share: 0.5          # the detail is at most this share of the face around it (else it's a step, not a detail)
  # On upright faces the layers draw the detail: letters under ~3 mm tall lose their horizontal strokes, and
  # engraving deeper than ~0.8 mm droops at the top of each letter (an unsupported roof) [text_embossing_debossing_limits].
  side_min_height_mm: 3.0
  side_max_depth_mm: 0.8
  side_max_offset_mm: 1.5  # only patches this close to the face count as text / details (deeper: bosses, lips, ribs)

gaps:
  fuse_below_mm: 0.2              # slots/clearances narrower than this fuse shut [slant3d_internal_micro_voids_3x_strength, mechanical_clearances_by_fit]
  # A flat gap stacked in height (the flat top of a pin under a cap, a print-in-place hinge's knuckle faces): the
  # ceiling is bridged right over the plastic below, sags and fuses below this; 0.4–0.6 mm works for short bridges
  # like chain links [sourced_F mistake #29, Maker's Muse print-in-place hinges].
  z_fuse_below_mm: 0.4
  z_min_area_mm2: 4               # smaller facing patches: a speck, not a joint

ironing:
  # A large flat top (lid, badge, nameplate, a face that gets glued) is where ironing shows: the nozzle
  # passes over the last layer with almost no flow and smooths the ridges. Only the topmost face, since
  # ironing every top surface adds a lot of time [OrcaSlicer wiki quality_settings_ironing; Prusa KB ironing_177488].
  min_top_area_mm2: 300           # about 17 x 17 mm; smaller tops gain little for the extra time
seam:
  # Every wall loop starts and ends somewhere: the seam. On a part with corners the slicer hides it in one;
  # a round outline has none, so the seam shows as a line of blobs. A scarf seam ramps the start and end
  # over each other instead [OrcaSlicer wiki quality_settings_seam].
  round_min: 0.95                 # 4πA/P² of an outline above this counts as round (a square is 0.79)
  round_share: 0.6                # this share of layers round: recommend the scarf seam
holes:
  vertical_min_mm: 1.5            # smaller vertical holes close up (0.4 nozzle) [vertical_hole_shrinkage_polyholes]
  vertical_min_nozzle: 3.5        # scaled for other nozzles: max(vertical_min_mm * nozzle/0.4, this * nozzle)
  undersize_up_to_mm: 6.0         # holes up to this size print 0.15–0.3 mm undersized [vertical_hole_shrinkage_polyholes]
  typical_undersize_mm: [0.15, 0.3]
  xy_hole_compensation_mm: 0.1    # [vertical_hole_shrinkage_polyholes]
  measured_min_mm: 0.04           # a measured size error smaller than this is measuring noise: no compensation
  circularity_min: 0.85           # 4πA/P² above this counts as a round hole

bridges:
  sag_from_mm: 4.0                # hole/slot tops wider than this sag 0.2–0.4 mm [horizontal_hole_teardrop_flat_top]
  sag_mm: [0.2, 0.4]
  large_sag_from_mm: 8.0          # flat roofs wider than this sag 0.4–1.0 mm [mistake_18_large_horizontal_circular_holes]
  tunnel_ratio: 4.0               # supported sideways hole longer than this × its diameter: support can't be pulled out
  pocket_depth_mm: 10.0           # support in a side pocket deeper than this ... (estimate, like tunnel_ratio)
  pocket_ratio: 2.0               # ... and deeper than this × its opening is hard to reach and pull out

first_layer:
  zone_mm: 0.6                    # bottom layers affected by squish / elephant foot
  detail_min_mm: 0.65             # strokes/gaps on the bed side narrower than this get squashed or closed [text_embossing_debossing_limits, problem_elephant_foot]
  elephant_foot_mm: [0.1, 0.25]   # bulge per side [problem_elephant_foot]
  # Orientation choice: separate spots on the bed smaller than this (a tip, a thin post, a corner)
  # hold on by little and get pulled loose by the nozzle. Estimate, well below the 150 mm² a whole
  # part needs [problem_bed_adhesion_moisture_heat_creep_ringing].
  island_min_mm2: 25
  thin_lines: 3                   # first-layer strips narrower than this many lines stick badly (estimate)

warping:
  # Footprint length (mm, longest side of an island on the bed) where corner lifting becomes likely.
  # From shrinkage rates (PLA 0.2–0.4 %, PETG 0.3–0.5 %, ABS 0.6–0.9 %, PA-CF 0.3–0.5 %) calibrated to
  # "ABS on an open printer: risky from ~40–50 mm" [problem_warping_and_corner_lifting, mistake_23_printing_abs_asa_pc_on_open_printer].
  risk_length_mm:
    pla: {none: 110, passive: 110, heated: 110}
    petg: {none: 85, passive: 100, heated: 100}
    abs: {none: 45, passive: 75, heated: 115}
    pa_cf: {none: 85, passive: 110, heated: 140}
    # T-026 materials, scaled from their shrinkage like the ones above (estimates, see T-104).
    pla_plus: {none: 110, passive: 110, heated: 110}
    asa: {none: 55, passive: 85, heated: 120}
    pc: {none: 40, passive: 70, heated: 110}
    tpu_95a: {none: 140, passive: 140, heated: 140}
  sharp_corner_max_deg: 100       # convex corners sharper than this lift first [problem_warping_and_corner_lifting]
  fillet_radius_mm: 3.0           # suggested corner radius [problem_warping_and_corner_lifting]
  brim_width_mm: 8                # [corner_mouse_ears_vs_brim]

pins:
  max_width_mm: 8.0               # upright pins/posts thinner than this break along layers [mistake_01_z_axis_tension_orientation]
  min_aspect: 3.0                 # ... when height >= this × width
  wobble_aspect: 10.0             # this slender wobbles and prints rough

necks:
  area_ratio: 0.3                 # a layer with < 30 % of the area above and below is a weak neck
  window_mm: 10.0

stability:
  tip_aspect: 4.0                 # height / base width [problem_bed_adhesion_moisture_heat_creep_ringing]
  min_bed_contact_mm2: 150        # [problem_bed_adhesion_moisture_heat_creep_ringing]

cooling:
  # Heat build-up (heat.py): the temperature 1 mm below the top, compared with the material's softening
  # point. The model runs warm (a big PLA block on a 55 °C bed comes out ~53 °C), so only a clear
  # margin counts. Rough, set so that a Ø3 mm pin is flagged and a 10 mm tower isn't (T-126 calibrates).
  soft_margin_c: 32               # "may get soft" (info)
  hot_margin_c: 45                # "will droop / blob" (warn)
  above_bed_mm: 2.0               # the bed keeps the first layers warm anyway
  min_run_mm: 1.0
  # Minimum print speeds tried when small layers stay soft (highest first): the slicer's slow-down for layer
  # cooling stops at the filament's slow_down_min_speed (Orca default 10 mm/s), so a thin pin never gets the
  # full minimum layer time (OrcaSlicer wiki, Material cooling: Min print speed).
  try_min_speeds: [5, 3, 2]
  try_layer_times_s: [15, 20]     # then a longer minimum layer time (at the lowest speed above)

fasteners:
  # Metric screws. Clearance: ISO 273 close / medium series. Nuts: ISO 4032 (across flats, max height).
  # pilot: hole to screw straight into printed plastic (~0.8 × d); insert: heat-set insert hole
  # (Ruthex standard inserts). Values gathered with Gemini, checked against the standards' tables.
  # insert_length_mm: Ruthex standard insert length (the hole wants ~0.5–1 mm more depth,
  # https://www.ruthex.de/pages/cad-daten); washer_od_mm: ISO 7089 washer, the flat face a bolt head needs.
  M2:   {d: 2.0, clearance_close_mm: 2.2, clearance_normal_mm: 2.4, pilot_mm: 1.6, insert_hole_mm: 3.2, nut_af_mm: 4.0, nut_thickness_mm: 1.6, insert_length_mm: 4.0, washer_od_mm: 5.0}
  M2.5: {d: 2.5, clearance_close_mm: 2.7, clearance_normal_mm: 2.9, pilot_mm: 2.1, insert_hole_mm: 3.6, nut_af_mm: 5.0, nut_thickness_mm: 2.0, insert_length_mm: 5.7, washer_od_mm: 6.0}
  M3:   {d: 3.0, clearance_close_mm: 3.2, clearance_normal_mm: 3.4, pilot_mm: 2.5, insert_hole_mm: 4.0, nut_af_mm: 5.5, nut_thickness_mm: 2.4, insert_length_mm: 5.7, washer_od_mm: 7.0}
  M4:   {d: 4.0, clearance_close_mm: 4.3, clearance_normal_mm: 4.5, pilot_mm: 3.4, insert_hole_mm: 5.6, nut_af_mm: 7.0, nut_thickness_mm: 3.2, insert_length_mm: 8.1, washer_od_mm: 9.0}
  M5:   {d: 5.0, clearance_close_mm: 5.3, clearance_normal_mm: 5.5, pilot_mm: 4.3, insert_hole_mm: 6.4, nut_af_mm: 8.0, nut_thickness_mm: 4.7, insert_length_mm: 9.5, washer_od_mm: 10.0}
  M6:   {d: 6.0, clearance_close_mm: 6.4, clearance_normal_mm: 6.6, pilot_mm: 5.2, insert_hole_mm: 8.0, nut_af_mm: 10.0, nut_thickness_mm: 5.2, insert_length_mm: 12.7, washer_od_mm: 12.0}
  match_tol_mm: 0.1   # a hole within this of a screw's nominal size is "modelled at screw size"
  # Nut traps: a hexagonal pocket needs ~0.2-0.3 mm more across the flats than the nut (M3: 5.7 mm to slide
  # in, 5.8 mm to press into a recess) because printed holes come out small
  # [OpenFlexure nut traps, ISO 4032 https://gitlab.com/openflexure/openflexure-microscope/-/merge_requests/371;
  # fb-library bolt fittings https://fb-library.readthedocs.io/en/latest/bolt_fittings/].
  nut_clearance_mm: 0.2   # less than this over the nut's size: the nut won't go in
  nut_match_mm: [-0.1, 0.8]  # a hex pocket this much smaller / bigger than a nut counts as that nut's trap
  # Heat-set inserts press melted plastic outwards: thinner walls bulge or split. ~1.6 mm minimum, ~2 mm
  # recommended for M3/M4 [DigiKey Maker.io heat-set inserts; Sovol "Design strong screw bosses"].
  insert_min_wall_mm: 1.6
  insert_match_mm: 0.15   # a round hole this close to an insert's hole size counts as an insert hole
  # A screw cut straight into the plastic needs about its own diameter of wall around the hole (M5: 5 mm)
  # [Hubs, How to assemble 3D printed parts with threaded fasteners,
  # https://www.hubs.com/knowledge-base/how-assemble-3d-printed-parts-threaded-fasteners/].
  pilot_match_mm: 0.1     # a round hole this close to a screw's pilot size counts as a pilot hole
  # Screw cut straight into plastic: at least 2× its diameter of thread (2–2.5 d for plastics, more when it
  # pulls along the layers) [EJOT fasteners for plastics, https://www.ejot.com/fasteners-for-plastics].
  engage_d: 2.0
  insert_extra_depth_mm: 0.5   # hole deeper than the insert so its melted plastic has somewhere to go
  # A nut pushed in from the side slides in a slot: ~0.2–0.4 mm over the nut's size both ways
  # [Voron Design printed parts, https://github.com/VoronDesign/Voron-2].
  nut_slot_extra_mm: 0.3

setup:
  # Checks of the user's own presets and slicer values [sourced_F mistakes #20, #24, #26, #27].
  max_layer_share: 0.75           # layer height above this × the nozzle: layers bond badly
  min_support_gap_mm: 0.1         # support top gap below this with the same filament: support welds on
  standard_hotend_flow_mm3s: 24   # a "max flow" above this needs a high-flow hotend (standard: about 11-22 for PLA)
  sticky_on_smooth: [petg, tpu, pc]   # bond too hard to smooth PEI / bare glass
facets:
  # A curve exported with too few flat facets (a hole as a 12-gon) prints as flats. Neighbouring flat strips
  # that turn by min_turn..max_turn degrees are pieces of one curve (finer: smooth; sharper: a designed edge,
  # an octagon or hexagon); each strip's middle sits (width / 2) · tan(turn / 4) inside the true curve.
  min_turn_deg: 4
  max_turn_deg: 40
  error_mm: 0.05                  # this far off the round shape: fits and hole sizes change [sourced_F mistake #17]
  warn_mm: 0.1
  min_strips: 4                   # fewer in a row is a chamfer or two, not a curve
vase:
  # Spiral vase mode prints one continuous outer wall over solid bottom layers: no seam, no infill, no top
  # [OrcaSlicer wiki others_settings_special_mode]. Offered for open containers (cups, vases, lampshades):
  # one outline per layer, the inside open to the top, no support.
  min_height_mm: 20
  min_open_share: 0.5             # the opening reaches down at least this share of the height
  min_saving: 0.15                # offered only when it saves this share of the print time or more
  max_wall_mm: 3.0                # thicker walls: not a container, one line would be a different part
grip:
  # Fuzzy skin: the slicer jiggles the outer wall into a rough, grippy surface that also hides layer lines
  # [OrcaSlicer wiki others_settings_fuzzy_skin]. Thickness stays under the outer wall's line width there.
  # Suggested when the file name says what the part is for (a knob or handle is gripped all over).
  words: [knob, handle, grip, dial, lever, crank, knauf, griff, drehknopf, hebel, kurbel]
  thickness_mm: 0.3
  point_distance_mm: 0.8
slopes:
  # Top faces this shallow (degrees from flat) print as visible steps: each layer's edge is layer height / tan
  # (slope) wide, ~1.1 mm at 10° and 0.2 mm layers [sourced_F mistake #22]. Steeper ones look smooth; flatter
  # ones are flat tops (ironing). Thinner layers only over their height range make the steps narrower.
  min_deg: 5
  max_deg: 20
  min_area_mm2: 30                # smaller sloped bits: nobody sees the steps
  visible_step_mm: 0.5            # steps narrower than this hardly show
  merge_gap_mm: 1.0               # sloped faces this close in height share one range
  fine_ratio: 0.2                 # thinner layers: this × the nozzle (0.08 mm for 0.4 mm)
  fine_min_mm: 0.08
  fine_gain: 0.6                  # only worth it when the thinner layers are at most this share of the ones used
pauses:
  # Closed pockets for parts dropped in while printing (magnets, nuts, bearings, weights): smaller than this
  # is a modelling leftover, not a pocket; the roof must be flat over this share of the pocket's footprint
  # (a dome narrows above the widest point, so the part would have to go in earlier).
  min_pocket_mm3: 20
  roof_flat_share: 0.5

threads:
  # Printed threads: below M5 they come out too rough to work [Hubs, How to assemble 3D printed parts with threaded
  # fasteners: "Threads smaller than M5 printed via FDM should be avoided",
  # https://www.hubs.com/knowledge-base/how-assemble-3d-printed-parts-threaded-fasteners/]; moving parts want
  # ~0.3 mm clearance [Prusa KB, Modeling with 3D printing in mind,
  # https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135]. A 60° thread's flank is a slope:
  # with fewer than ~4 layers per pitch it prints as a staircase of 2-3 steps (geometry, our rule of thumb).
  min_major_mm: 5.0
  min_layers_per_pitch: 4
  lying_ok_major_mm: 8.0   # lying on its side, smaller threads lose their shape to the layer steps
  clearance_mm: 0.3

fits:
  # Gap to add to the mating part's size (diameter, mm) when modelling a round hole, or to take off a
  # round post, for a 0.4 mm nozzle. Rule of thumb from clearance-gauge prints: ~0.2 mm pushes in
  # snugly, ~0.3–0.4 mm slides and turns [Maker's Muse clearance gauge https://www.youtube.com/watch?v=TYuLVN3YHw8;
  # Prusa KB "Modeling with 3D printing in mind" https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135].
  # Printers differ: a fit test print (T-170) gives the real numbers.
  gap_mm: {press: 0.1, snug: 0.2, sliding: 0.35, loose: 0.5}
  sideways_extra_mm: 0.1   # holes lying on their side come out a little smaller at the top
  min_change_mm: 0.05      # smaller differences are left alone

magnet_slots:
  # A magnet or nut slid in from the side after printing, instead of a pause mid-print or glue: a slot from the
  # closed pocket to the nearest side, with a small bump on each slot wall that it clicks past (0.25–0.35 mm
  # interference) [Slant 3D, Stop Gluing Magnets Into Your 3D Prints https://www.youtube.com/watch?v=46zH3BI8-LQ;
  # research/sourced_A2 slant3d_glue_free_magnet_retention].
  lip_mm: 0.3                     # each bump reaches this far into the slot
  bump_radius_mm: 0.8
  bump_from_pocket_mm: 1.0        # the bumps stand this far out from the pocket
  max_length_mm: 15               # farther from a side: a long tunnel to push it through, not offered
grip_fins:
  # Instead of a rigid press fit: an open pocket with thin angled fins whose tips reach past the pressed-in
  # part. They bend like leaf springs, so the grip survives ±0.25 mm of printer error (a rigid bore: ±0.05).
  # Fins 0.8–1.0 mm thick, 20–35° off the radial line, 0.15–0.30 mm interference, 3–6 of them [Slant 3D, How to
  # Design a Print with Perfect Tolerance https://www.youtube.com/watch?v=XKrDUnZCmQQ; You Don't Use Fins Enough
  # https://www.youtube.com/watch?v=6gPPAiqSkBc; research/sourced_A2 slant3d_elastic_grip_fins_for_tolerances].
  thickness_mm: 0.9               # at least two printed lines
  angle_deg: 30
  interference_mm: 0.2            # per side: fin tips this far inside the partner's surface
  length_mm: 2.5                  # long enough to bend (stubby radial fins don't)
  min_length_mm: 1.2              # less room than this in the wall: no fins
  min_wall_mm: 1.2                # plastic left around the pocket
  count_by_diameter: [[6, 3], [12, 4], [1000, 6]]   # partner up to Ø mm: fins

shrinkage:
  # Parts shrink as they cool (linear %, per material in presets.yaml). Report when the longest
  # dimension comes out this much short. Rough: depends on brand, infill and part shape.
  report_from_mm: 0.3
  warn_from_mm: 0.6

flex:                             # parts that bend on purpose, and thick blocks (T-181)
  hinge_max_mm: 1.2               # a web this thin between two thicker pieces is a living hinge (0.4–0.6 mm typical) [facfox living hinges]
  hinge_gap_mm: [0.5, 10.0]       # ... when the pieces it joins are this far apart
  hinge_min_long_mm: 4.0          # ... and the web is at least this long along the fold
  hinge_good: [tpu_95a, petg]     # survive many bends; PLA lasts ~150–200 folds [Balderrama-Armendariz, SFF 2016]
  hinge_bad: [pla, pla_plus, pa_cf]
  snap_mm: [0.8, 3.5]             # thickness of a snap-fit tab
  snap_min_aspect: 4.0            # tab length >= this × its thickness
  hook_min_mm: 0.3                # the tip sticks out at least this much: a hook
  # Strain a tab may bend to, flat (along the lines), %: ~10–15 % of elongation at break (Hackaday:
  # PLA ~8 %, PETG ~24 %); across the layers about half [Core77 snap-fit guide]. Estimates: verify.
  snap_strain_pct: {pla: 1.0, pla_plus: 1.2, petg: 2.5, abs: 2.0, asa: 2.0, pc: 2.5, pa_cf: 1.0, tpu_95a: 10.0}
  across_layers: 0.5
  thick_mm: 16.0                  # sections thicker than this all round are solid blocks
  thick_min_cm3: 15.0             # ... reported when this much of the part is that thick
  thick_min_share: 0.25           # ... and at least this share of it

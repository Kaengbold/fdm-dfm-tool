finding.grip_texture.title: "Add grip texture"
finding.grip_texture.one_liner: "Smooth outer wall; fuzzy skin adds grip and hides layer lines."

finding.floor_shrink_line.title: "Floor pulls outer line"
finding.floor_shrink_line.one_liner: "Solid internal floor shrinks and pulls a visible line outside."

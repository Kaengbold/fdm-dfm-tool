# --- Printability & knowledge-base rules (every rule in rules.yaml) ---

finding.large_deflection.title: "This part bends a lot"
finding.large_deflection.one_liner: "As the part bends, the load acts on a different shape."
finding.compression_buckling.title: "Thin walls can bow under load"
finding.compression_buckling.one_liner: "A long, thin wall can suddenly bow sideways under compression."

finding.long_bridge.title: "Long bridge will sag"
finding.long_bridge.one_liner: "Unsupported span is too long; strands droop and leave a rough underside."
finding.long_bridge.one_liner_span: "{span} mm span is over {material}'s {max_bridge} mm limit; underside sags."

finding.too_thin_to_print.title: "Too thin to print"
finding.too_thin_to_print.one_liner: "Thinner than the nozzle can print; the slicer skips this feature."
finding.too_thin_to_print.one_liner_size: "About {width} mm wide; a {nozzle} mm nozzle skips it completely."

finding.small_bed_contact.title: "Small contact with bed"
finding.small_bed_contact.one_liner: "Very little touches the bed; the part can break loose mid-print."
finding.small_bed_contact.one_liner_none: "Nothing touches the bed in this pose; the print fails right away."
finding.small_bed_contact.one_liner_area: "Only {area} mm² touches the bed; the part can break loose mid-print."

finding.print_may_fail.title: "Print may come loose"
finding.print_may_fail.one_liner: "Several bed risks add up; the part may lift or tip over mid-print."

finding.tipping_risk.title: "Tall part can tip"
finding.tipping_risk.one_liner: "Tall over a narrow base; the nozzle can knock it over mid-print."
finding.tipping_risk.one_liner_size: "{height} mm tall on a {width} mm base; nozzle can knock it over."

finding.tall_thin_feature.title: "Tall thin part wobbles"
finding.tall_thin_feature.one_liner: "Slender upright section bends under the nozzle and prints messy."
finding.tall_thin_feature.one_liner_size: "{width} mm wide, {height} mm tall; wobbles and prints messy."

finding.small_layers_cooling.title: "Layers print too fast to cool"
finding.small_layers_cooling.one_liner: "Short layers stay soft when the next one lands; thin sections can sag or blob."
finding.small_layers_cooling.one_liner_temp: "Still ~{temp} °C when the next layer lands; thin sections can sag or blob."

finding.heat_too_hot.title: "Spot stays too hot"
finding.heat_too_hot.one_liner: "Plastic is still soft when the next layer lands; it may sag or blob."
finding.heat_too_hot.one_liner_temp: "Still ~{temp} °C at next layer (limit {limit} °C); may sag or blob."

finding.heat_weak_bond.title: "Layers cool too fast"
finding.heat_weak_bond.one_liner: "Previous layer cools too far; layers bond weakly and snap easier."
finding.heat_weak_bond.one_liner_bond: "Only ~{bond}% layer bond here; snaps more easily along layers."

finding.heat_needless_slowdown.title: "Unneeded cooling slowdown"
finding.heat_needless_slowdown.one_liner: "Slicer slows down for cooling while layers are already too cool."
finding.heat_needless_slowdown.one_liner_time: "Slows ~{minutes} min for cooling while layers already bond poorly."

finding.enclosure_recommended.title: "Material warps in open air"
finding.enclosure_recommended.one_liner: "Drafts cool this plastic too fast; corners lift and layers split."
finding.enclosure_recommended.one_liner_mat: "{material} needs warm air; open drafts warp and split layers."

finding.hardened_nozzle_required.title: "Needs a hardened nozzle"
finding.hardened_nozzle_required.one_liner: "Abrasive filament wears brass nozzles fast and ruins print size."
finding.hardened_nozzle_required.one_liner_mat: "{material} wears out brass nozzles fast and ruins print size."

finding.dry_filament.title: "Filament needs drying"
finding.dry_filament.one_liner: "Absorbs air moisture; prints stringy, bubbly, and weak if wet."
finding.dry_filament.one_liner_mat: "{material} absorbs moisture; wet spools print stringy and weak."

finding.stress_at_inside_corner.title: "Sharp inside corner can crack"
finding.stress_at_inside_corner.one_liner: "Stress builds up here. Repeated loads make cracks more likely."
fillet.load.general: "How much rounding helps a printed part under a steady load varies between tests. It matters more for clips, hinges and brackets that flex or shake repeatedly."
fillet.load.repeated: "Rounding is worth trying here. In printed parts it matters more when the part flexes or shakes repeatedly."
fillet.load.steady: "For a load applied once or held steady, how much rounding helps a printed part varies between tests."
fillet.load.orientation: "Start by printing the part so the load runs along the layers and is less likely to pull them apart."

finding.too_hot_in_use.title: "Too hot where used"
finding.too_hot_in_use.one_liner: "Use temperature approaches softening; the part bends or creeps."
finding.too_hot_in_use.one_liner_soft: "{material} softens at {limit} °C; bends or sags at {temp} °C."
finding.too_hot_in_use.one_liner_near: "Near {material}'s {limit} °C limit at {temp} °C; creeps under load."

finding.side_detail_small.title: "Side text too fine"
finding.side_detail_small.one_liner: "Upright text is too small or deep to print cleanly."
finding.side_detail_small.one_liner_small: "Only {height} mm tall; too few layers for clear upright letters."
finding.side_detail_small.one_liner_deep: "Engraved {depth} mm deep; top edges of upright letters droop."

finding.shallow_relief.title: "Top detail too shallow"
finding.shallow_relief.one_liner: "Raised or sunk detail is too shallow and may barely show."
finding.shallow_relief.one_liner_vanish: "Only {depth} mm ({layers} layers); top detail may not show."
finding.shallow_relief.one_liner_faint: "Only {depth} mm ({layers} layers); top detail prints faintly."

finding.elephant_foot.title: "Bottom edge bulges out"
finding.elephant_foot.one_liner: "First layers squish outward 0.1–0.2 mm; bed holes print tight."
finding.elephant_foot.one_liner_holes:
  one: "{count} bed hole bulges 0.1–0.2 mm tighter at the bottom."
  other: "{count} bed holes bulge 0.1–0.2 mm tighter at the bottom."

finding.exceeds_build_volume.title: "Too big for printer"
finding.exceeds_build_volume.one_liner: "Larger than the build plate; the slicer cannot fit this part."
finding.exceeds_build_volume.one_liner_printer: "Larger than the {printer} bed; the slicer cannot fit it."

finding.turned_to_fit.title: "Turned on bed to fit"
finding.turned_to_fit.one_liner: "Rotated on the bed so it fits; keep this angle in your slicer."
finding.turned_to_fit.one_liner_deg: "Turned {deg}° so it fits the {printer} bed; keep this angle."

finding.support_marks.title: "Rough underside from supports"
finding.support_marks.one_liner: "Supported overhang prints rougher where breakaway supports touch."
finding.support_marks.one_liner_area: "~{area} mm² rests on supports; underside prints rough."
finding.support_marks.one_liner_clean: "Supports touch your clean face (~{area} mm²) and leave marks."

finding.trapped_support.title: "Support trapped inside"
finding.trapped_support.one_liner: "Enclosed overhang needs support inside that you cannot remove."

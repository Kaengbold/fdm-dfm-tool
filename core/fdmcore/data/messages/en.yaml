# English text for engine findings (T-524, T-454).
# Keys follow <area>.<what>; {name} placeholders match web/i18n.js.
# Plurals use {one: ..., other: ...} selected by params.count.
# Rules:
#   - finding.<rule>.title: <= 6 words, plain hobbyist language, sentence case.
#   - finding.<rule>.one_liner*: <= 80 chars, what goes wrong and why it matters.
#   - finding.place.*: short location / feature pill.


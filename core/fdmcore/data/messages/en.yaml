finding.trapped_support.one_liner_pocket: "Pocket {depth} mm deep behind {opening} mm mouth traps support."

finding.bridge_sag.title: "Unsupported top sags"
finding.bridge_sag.one_liner: "Flat ceiling bridges in mid-air and sags into the opening."
finding.bridge_sag.one_liner_span: "{span} mm span droops ~{sag} mm into the opening."

finding.hole_starts_midair.title: "Hole starts in mid-air"
finding.hole_starts_midair.one_liner: "Hole opens over empty space; the first rim droops and prints messy."
finding.hole_starts_midair.one_liner_size: "Ø{d} mm hole starts over air; the first rim droops."

finding.sideways_hole_oval.title: "Side hole prints oval"
finding.sideways_hole_oval.one_liner: "Top sags ~0.3 mm; round pins and bolts will not slide in."

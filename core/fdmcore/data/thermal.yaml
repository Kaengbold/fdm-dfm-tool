    # Seppala et al. measured C1 = 4.65, C2 = 200.9 C at Tref = 230 C. Shifted to Tref = Tg (105 C):
    # c1 = C1 * C2 / (C2 - 125) = 12.3, c2 = C2 - 125 = 75.9 K.
    wlf:          {c1: 12.3, c2_k: 75.9, t_ref_c: 105, range_c1: [11, 17.44], range_c2_k: [51.6, 85], source: "Seppala et al. 2017, Soft Matter 13:6761, doi:10.1039/c7sm00950j (Makerbot ABS)", confidence: published}
    reptation_s:  {value: 0.1, range: [0.01, 1.0], unit: s, t_ref_c: 230, source: "estimate; Seppala 2017 found no terminal viscosity for ABS, so it gives no reptation time", confidence: estimated}
  asa:
    density:      {value: 1070, range: [1050, 1090], unit: kg/m3, source: "Prusament ASA TDS; presets.yaml", confidence: published}
    cp_glassy:    {value: 1300, range: [1200, 1450], unit: J/kgK, source: "as ABS / SAN", confidence: estimated}
    cp_melt:      {value: 2050, range: [1900, 2300], unit: J/kgK, source: "as ABS / SAN", confidence: estimated}
    k:            {value: 0.18, range: [0.15, 0.21], unit: W/mK, source: "typical handbook value", confidence: estimated}
    emissivity:   {value: 0.93, range: [0.90, 0.96], unit: "-", source: "typical polymer value", confidence: estimated}
    tg_c:         {value: 100, range: [97, 110], unit: C, source: "Polymaker PolyLite ASA TDS (97.8 C); presets.yaml", confidence: published}
    tm_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    latent_heat:  {value: 0, range: [0, 0], unit: J/kg, source: "amorphous", confidence: published}
    tc_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    no_sag_c:     {value: 115, range: [107, 125], unit: C, source: "Tg + about 15 C", confidence: estimated}
    wlf:          {c1: 12.3, c2_k: 75.9, t_ref_c: 100, range_c1: [11, 17.44], range_c2_k: [51.6, 85], source: "taken from ABS (Seppala 2017): same SAN matrix", confidence: estimated}
    reptation_s:  {value: 0.1, range: [0.01, 1.0], unit: s, t_ref_c: 250, source: "as ABS", confidence: estimated}
  tpu:
    density:      {value: 1210, range: [1180, 1240], unit: kg/m3, source: "typical 95A TDS", confidence: published}
    cp_glassy:    {value: 1500, range: [1350, 1700], unit: J/kgK, source: "typical polyurethane value (rubbery at room temperature)", confidence: estimated}
    cp_melt:      {value: 1950, range: [1800, 2200], unit: J/kgK, source: "typical value", confidence: estimated}
    k:            {value: 0.20, range: [0.17, 0.25], unit: W/mK, source: "typical handbook value", confidence: estimated}
    emissivity:   {value: 0.94, range: [0.90, 0.96], unit: "-", source: "typical polymer value", confidence: estimated}
    tg_c:         {value: -35, range: [-45, -20], unit: C, source: "soft-segment Tg, typical TDS", confidence: estimated}
    tm_c:         {value: 175, range: [150, 200], unit: C, source: "hard-segment melting, typical TDS", confidence: estimated}
    latent_heat:  {value: 15000, range: [5000, 30000], unit: J/kg, source: "hard-segment ordering, typical DSC", confidence: estimated}
    tc_c:         {value: 110, range: [90, 130], unit: C, source: "hard-segment ordering on cooling, typical DSC", confidence: estimated}
    no_sag_c:     {value: 110, range: [90, 130], unit: C, source: "about tc (hard domains lock the shape)", confidence: estimated}
    wlf:          {c1: 17.44, c2_k: 51.6, t_ref_c: -35, range_c1: [11, 19], range_c2_k: [40, 80], source: "universal WLF constants at the soft-segment Tg; a poor fit for a segmented polymer", confidence: estimated}
    reptation_s:  {value: 0.02, range: [0.002, 0.5], unit: s, t_ref_c: 220, source: "order-of-magnitude estimate", confidence: estimated}
  pa:
    density:      {value: 1060, range: [1010, 1140], unit: kg/m3, source: "PA12 1.01-1.03, PA6 1.13 g/cm3 (typical TDS)", confidence: published}
    cp_glassy:    {value: 1600, range: [1450, 1750], unit: J/kgK, source: "typical handbook value, dry", confidence: estimated}
    cp_melt:      {value: 2400, range: [2150, 2700], unit: J/kgK, source: "typical handbook value", confidence: estimated}
    k:            {value: 0.24, range: [0.20, 0.30], unit: W/mK, source: "typical handbook value, dry", confidence: estimated}
    emissivity:   {value: 0.93, range: [0.90, 0.96], unit: "-", source: "typical polymer value", confidence: estimated}
    tg_c:         {value: 50, range: [40, 60], unit: C, source: "dry PA12 about 45, PA6 about 55 (lower when wet)", confidence: estimated}
    tm_c:         {value: 180, range: [175, 225], unit: C, source: "PA12 about 178, PA6 about 220 (typical TDS)", confidence: published}
    latent_heat:  {value: 55000, range: [35000, 75000], unit: J/kg, source: "typical DSC for printed PA, depends on crystallinity", confidence: estimated}
    tc_c:         {value: 145, range: [135, 180], unit: C, source: "DSC cooling, PA12 about 145, PA6 about 170", confidence: estimated}
    no_sag_c:     {value: 145, range: [130, 175], unit: C, source: "about tc (crystallisation stops flow)", confidence: estimated}
    wlf:          {c1: 17.44, c2_k: 51.6, t_ref_c: 50, range_c1: [11, 19], range_c2_k: [40, 80], source: "universal WLF constants; above Tm an Arrhenius law fits PA better", confidence: estimated}
    reptation_s:  {value: 0.005, range: [0.0005, 0.05], unit: s, t_ref_c: 250, source: "order-of-magnitude estimate (low melt viscosity)", confidence: estimated}
  pc:
    density:      {value: 1200, range: [1190, 1220], unit: kg/m3, source: "Covestro Makrolon TDS", confidence: published}
    cp_glassy:    {value: 1220, range: [1150, 1300], unit: J/kgK, source: "typical handbook value", confidence: estimated}
    cp_melt:      {value: 1900, range: [1750, 2050], unit: J/kgK, source: "typical handbook value", confidence: estimated}
    k:            {value: 0.20, range: [0.19, 0.22], unit: W/mK, source: "Covestro Makrolon TDS", confidence: published}
    emissivity:   {value: 0.92, range: [0.90, 0.96], unit: "-", source: "typical polymer value", confidence: estimated}
    tg_c:         {value: 147, range: [110, 153], unit: C, source: "Covestro Makrolon TDS; PC filament blends are often lower (110-145)", confidence: published}
    tm_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    latent_heat:  {value: 0, range: [0, 0], unit: J/kg, source: "amorphous", confidence: published}
    tc_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    no_sag_c:     {value: 160, range: [125, 170], unit: C, source: "Tg + about 15 C (low end for PC blends)", confidence: estimated}
    wlf:          {c1: 17.44, c2_k: 51.6, t_ref_c: 147, range_c1: [11, 19], range_c2_k: [40, 80], source: "universal WLF constants at Tg", confidence: estimated}

# Thermal constants for the heat model (T-473) and the temperature window (T-474). T-470, 2026-11-18.
# Every value: value, range [lo, hi], unit, source, confidence.
#   published: read in the cited paper / datasheet;  estimated: typical value or derived, not measured for
#   consumer filament;  tuned: fitted to our own test prints (none yet: T-477, T-482).
# How each source was checked: research/thermal_constants.md. Temperatures in C, the rest SI.

materials:
  pla:
    density:      {value: 1240, range: [1230, 1250], unit: kg/m3, source: "NatureWorks Ingeo TDS; presets.yaml", confidence: published}
    cp_glassy:    {value: 1210, range: [1150, 1300], unit: J/kgK, source: "Pyda, Bopp, Wunderlich 2004, J. Chem. Thermodyn., doi:10.1016/j.jct.2004.05.003", confidence: published}
    cp_melt:      {value: 2100, range: [1950, 2200], unit: J/kgK, source: "Pyda et al. 2004, liquid fit at about 210 C", confidence: published}
    k:            {value: 0.16, range: [0.13, 0.20], unit: W/mK, source: "typical handbook value", confidence: estimated}
    emissivity:   {value: 0.92, range: [0.90, 0.96], unit: "-", source: "typical polymer value; Costa et al. 2014 use 0.96", confidence: estimated}
    tg_c:         {value: 58, range: [55, 62], unit: C, source: "NatureWorks Ingeo TDS", confidence: published}
    tm_c:         {value: 150, range: [145, 175], unit: C, source: "NatureWorks Ingeo TDS (grade dependent)", confidence: published}
    latent_heat:  {value: 0, range: [0, 36000], unit: J/kg, source: "printed PLA cools too fast to crystallise much; upper bound from Garlotta 2001 (dH0 93 J/g at about 40 % crystallinity), doi:10.1023/A:1020200822435", confidence: estimated}
    tc_c:         {value: 105, range: [95, 115], unit: C, source: "DSC cooling, typical", confidence: estimated}
    no_sag_c:     {value: 70, range: [62, 80], unit: C, source: "Tg + about 12 C (quenched, mostly amorphous bead)", confidence: estimated}
    wlf:          {c1: 17.44, c2_k: 51.6, t_ref_c: 58, range_c1: [11, 17.44], range_c2_k: [40, 80], source: "universal WLF constants at Tg", confidence: estimated}
    reptation_s:  {value: 0.04, range: [0.005, 0.5], unit: s, t_ref_c: 200, source: "order-of-magnitude estimate; no PLA value found", confidence: estimated}
  petg:
    density:      {value: 1270, range: [1260, 1290], unit: kg/m3, source: "Eastman / Prusament TDS; presets.yaml", confidence: published}
    cp_glassy:    {value: 1200, range: [1100, 1320], unit: J/kgK, source: "typical PET-family value", confidence: estimated}
    cp_melt:      {value: 1850, range: [1700, 2050], unit: J/kgK, source: "typical PET-family value", confidence: estimated}
    k:            {value: 0.20, range: [0.17, 0.24], unit: W/mK, source: "typical handbook value", confidence: estimated}
    emissivity:   {value: 0.93, range: [0.90, 0.96], unit: "-", source: "typical polymer value", confidence: estimated}
    tg_c:         {value: 78, range: [75, 82], unit: C, source: "Eastman TDS", confidence: published}
    tm_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    latent_heat:  {value: 0, range: [0, 0], unit: J/kg, source: "amorphous", confidence: published}
    tc_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    no_sag_c:     {value: 93, range: [85, 100], unit: C, source: "Tg + about 15 C", confidence: estimated}
    wlf:          {c1: 17.44, c2_k: 51.6, t_ref_c: 78, range_c1: [11, 18], range_c2_k: [40, 80], source: "universal WLF constants at Tg", confidence: estimated}
    reptation_s:  {value: 0.05, range: [0.005, 0.5], unit: s, t_ref_c: 240, source: "order-of-magnitude estimate", confidence: estimated}
  abs:
    density:      {value: 1040, range: [1030, 1080], unit: kg/m3, source: "typical TDS; presets.yaml", confidence: published}
    cp_glassy:    {value: 1350, range: [1250, 1450], unit: J/kgK, source: "typical handbook value", confidence: estimated}
    cp_melt:      {value: 2100, range: [1950, 2300], unit: J/kgK, source: "typical handbook value", confidence: estimated}
    k:            {value: 0.18, range: [0.15, 0.21], unit: W/mK, source: "typical handbook value", confidence: estimated}
    emissivity:   {value: 0.96, range: [0.90, 0.96], unit: "-", source: "Costa, Duarte, Covas 2014, Virtual Phys. Prototyping, doi:10.1080/17452759.2014.984042 (value used in their ABS model)", confidence: published}
    tg_c:         {value: 105, range: [100, 110], unit: C, source: "typical TDS; presets.yaml heat_limit_c", confidence: published}
    tm_c:         {value: null, unit: C, source: "amorphous", confidence: published}
    latent_heat:  {value: 0, range: [0, 0], unit: J/kg, source: "amorphous", confidence: published}
    tc_c:         {value: null, unit: C, source: "amorphous", confidence: published}

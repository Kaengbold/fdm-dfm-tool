# Printer, material and nozzle presets.
# Numbers are typical values for rough estimates, not datasheet guarantees.
# Corrections welcome — please cite a source in the PR.

printers:
  bambu_a1:
    name: Bambu Lab A1
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [256, 256, 256]
    enclosure: none          # none | passive | heated
    hardened_nozzle: true    # stock hardened steel nozzle
    speed: fast
    multi_material: optional       # none | optional (AMS/MMU add-on) | builtin
  bambu_a1_mini:
    name: Bambu Lab A1 mini
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [180, 180, 180]
    enclosure: none
    hardened_nozzle: true
    speed: fast
    multi_material: optional       # none | optional (AMS/MMU add-on) | builtin
  bambu_p1s:
    name: Bambu Lab P1S
    bed: [256, 256, 256]
    enclosure: passive
    hardened_nozzle: false   # stock stainless steel
    speed: fast
    multi_material: optional       # none | optional (AMS/MMU add-on) | builtin
  bambu_x1c:
    name: Bambu Lab X1 Carbon
    bed: [256, 256, 256]
    enclosure: passive
    hardened_nozzle: true
    speed: fast
    multi_material: optional       # none | optional (AMS/MMU add-on) | builtin
  bambu_h2d:
    name: Bambu Lab H2D
    bed: [325, 320, 325]
    enclosure: heated
    hardened_nozzle: true
    speed: fast
    multi_material: builtin       # none | optional (AMS/MMU add-on) | builtin
  prusa_mk4s:
    name: Prusa MK4S
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [250, 210, 220]
    enclosure: none
    hardened_nozzle: false   # depends on the nozzle fitted; with a hardened one, set it under My printers
    speed: medium
    multi_material: optional       # none | optional (AMS/MMU add-on) | builtin
  prusa_mini:
    name: Prusa MINI+
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [180, 180, 180]
    enclosure: none
    hardened_nozzle: false
    speed: medium
    multi_material: none       # none | optional (AMS/MMU add-on) | builtin
  prusa_core_one:
    name: Prusa CORE One
    bed: [250, 220, 270]
    enclosure: heated        # bed-heated, regulated chamber
    hardened_nozzle: false   # depends on the nozzle fitted; with a hardened one, set it under My printers
    speed: fast
    multi_material: optional       # none | optional (AMS/MMU add-on) | builtin

  # Added in T-026 from manufacturer spec pages (values gathered with Gemini, cross-checked by hand;
  # entries marked "verify" are less certain — corrections welcome).
  creality_k1c:
    name: Creality K1C
    bed: [220, 220, 250]
    enclosure: passive
    hardened_nozzle: true    # steel-tipped nozzle stock
    speed: fast
    multi_material: optional # CFS via Creality's K1 Series CFS Upgrade Kit (store.creality.com/products/k1-series-cfs-upgrade-accessory-kit); not 2025 units
  creality_k2_plus:
    name: Creality K2 Plus
    bed: [350, 350, 350]
    enclosure: heated        # active chamber heater
    hardened_nozzle: true
    speed: fast
    multi_material: optional # CFS (sold as the Combo)
  creality_ender3_v3_se:
    name: Creality Ender-3 V3 SE
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [220, 220, 250]
    enclosure: none
    hardened_nozzle: false
    speed: medium
    multi_material: none
  creality_ender3_v3_ke:
    name: Creality Ender-3 V3 KE
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [220, 220, 240]
    enclosure: none
    hardened_nozzle: false   # 300 °C bi-metal hotend, brass nozzle (Creality store, research/gemini_printer_specs.md)
    speed: fast
    multi_material: none
  elegoo_centauri_carbon:
    name: Elegoo Centauri Carbon
    bed: [256, 256, 256]
    enclosure: passive
    hardened_nozzle: true
    speed: fast
    multi_material: optional # Elegoo CANVAS multi-colour add-on (elegoo.com Centauri Carbon page)
  anycubic_kobra_3:
    name: Anycubic Kobra 3
    moving_bed: true         # the bed moves along Y (bed slinger): tall thin parts are turned along it
    bed: [250, 250, 260]
    enclosure: none
    hardened_nozzle: false
    speed: fast
    multi_material: optional # ACE Pro
  prusa_xl:
    name: Prusa XL (single tool)
    bed: [360, 360, 360]
    enclosure: none
    hardened_nozzle: false   # depends on the nozzle fitted; with a hardened one, set it under My printers
    speed: fast
    multi_material: optional # extra toolheads

materials:
  # nozzle/bed/fan/softening temperatures: OrcaSlicer 2.x "Generic <material> @System" filament profiles
  # (PLA+ uses PLA's).
  # max_overhang_deg / max_bridge_mm: lower end of the ranges in research/sourced_A1_geometry_rules.yaml
  # [overhang_angle_by_material, bridging_length_by_material]
  # heat_limit_c: temperature where a printed part has lost most of its stiffness and strength: the glass
  # transition for PLA (~60 °C, Grasso et al. 2018, Rapid Prototyping Journal, doi:10.1108/RPJ-04-2017-0055),
  # PETG, ABS, ASA and PC (typical datasheet values); for semi-crystalline PA-CF and soft TPU a conservative
  # heat-deflection value. Approximate: brand datasheets (research job G-3) should replace them.
  # max_flow_mm3s: how fast the hotend can melt it: OrcaSlicer 2.x's generic filament profiles for the
  # P1S and the K1C (filament_max_volumetric_speed, inherits chain resolved; PLA 16 / 14, PETG 12 / 12,
  # ABS 15 / 16, ASA 12 / 16, PC 16 / 10, TPU 3.2 / 3, PA-CF 8 / 8), averaged, so print times follow
  # what the slicer will do. Branded filament and high-flow hotends go faster; set your own under
  # My materials (imports it from an Orca .json).
  # uv_resistance: how it lasts in sunlight. ASA is made for outdoor use (it replaces ABS there); PLA and ABS
  # turn brittle / yellow; PETG, PC, nylon and TPU are in between. General polymer knowledge, approximate (G-3).
  # Environment fields (T-520): water, abrasion, oil_fuel, solvent, skin (good | fair | poor | null), and
  # food_notes (plain-language string | null). Unknown or brand-dependent values stay null rather than guessed.
  # Primary sources:
  # - Prusament chemical resistance study: https://prusament.com/chemical-resistance-of-3d-printing-materials/
  # - Prusa food-safe FDM guide: https://help.prusa3d.com/article/food-safe-fdm-printing_112313
  # - Prusament product pages: PLA, PETG, ASA, PC Blend, PA11 CF, TPU 95A (prusament.com/materials/...)
  # - Prusa ABS KB: https://help.prusa3d.com/article/abs_2058
  # - Bambu Lab ASA-CF / PAHT-CF guide: https://wiki.bambulab.com/en/filament/asacf_pahtcf
  # - CNC Kitchen PA6-CF vs PA12-CF moisture test: https://www.cnckitchen.com/blog/carbon-fiber-nylon-in-3d-printing-pa6-vs-pa12-tested
  pla:
    name: PLA
    max_overhang_deg: 55
    max_bridge_mm: 35
    min_layer_time_s: 8
    warp_risk: low           # low | medium | high
    abrasive: false
    hygroscopic: low         # low | medium | high
    max_flow_mm3s: 15
    # Interlayer (Z) strength as a fraction of in-plane strength, by enclosure type.
    z_strength_factor: {none: 0.55, passive: 0.55, heated: 0.55}
    tensile_xy_mpa: 50       # Prusament PLA TDS: 51 MPa printed flat (ISO 527-1)
    modulus_xy_mpa: 2400     # printed specimens 2300–2400 MPa (Prusament PLA TDS); 3200+ is moulded resin
    density_g_cm3: 1.24
    shrinkage_pct: 0.3       # typical linear shrinkage after cooling
    nozzle_temp_c: 220
    bed_temp_c: 55
    fan_pct: 100          # part cooling on small layers
    softening_c: 45       # Orca's temperature_vitrification
    heat_limit_c: 60      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: poor     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: fair             # Prusament chem study: slight tensile drop in water immersion
    food_notes: "Not food-safe straight off the printer: layer gaps hold bacteria. Even with a food-contact certified PLA spool, use a food-safe coating or liner, and keep it out of hot water or dishwashers."
    abrasion: null          # unverified across standard PLA datasheets
    oil_fuel: null          # fuels unverified on standard PLA
    solvent: poor           # Prusament chem study: loses strength in IPA (>24 h), collapses in acetone
    skin: null              # standard hobby spools are not ISO 10993 skin-contact certified
  petg:
    name: PETG
    max_overhang_deg: 45
    max_bridge_mm: 15
    min_layer_time_s: 10
    warp_risk: low
    abrasive: false
    hygroscopic: medium
    max_flow_mm3s: 12
    z_strength_factor: {none: 0.6, passive: 0.65, heated: 0.7}
    tensile_xy_mpa: 45       # Prusament PETG 43–48 MPa; Polymaker PolyLite 32 MPa (TDS)
    modulus_xy_mpa: 1600     # printed specimens: Prusament 1500–1600, Polymaker 1470 MPa (TDS)
    density_g_cm3: 1.27
    shrinkage_pct: 0.4       # typical linear shrinkage after cooling
    nozzle_temp_c: 255
    bed_temp_c: 80
    fan_pct: 100          # part cooling on small layers
    softening_c: 70       # Orca's temperature_vitrification
    heat_limit_c: 80      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: fair     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: good             # Prusament chem study (toughness unchanged in water) & Prusament PETG (low water absorption)
    food_notes: "Not food-safe straight off the printer: layer gaps hold bacteria. PETG handles warm washes better than PLA, but still needs a food-contact certified spool plus a food-safe coating or liner."
    abrasion: null          # unverified across standard PETG datasheets
    oil_fuel: null          # oil/fuel immersion unverified on standard PETG
    solvent: fair           # Prusament chem study: brief ethanol/IPA OK; drops after 7-day IPA soak, damaged by acetone
    skin: null              # standard hobby spools are not ISO 10993 skin-contact certified
  abs:
    name: ABS
    max_overhang_deg: 40
    max_bridge_mm: 10
    min_layer_time_s: 10
    warp_risk: high
    abrasive: false
    hygroscopic: low
    max_flow_mm3s: 15
    z_strength_factor: {none: 0.3, passive: 0.5, heated: 0.65}
    tensile_xy_mpa: 38
    modulus_xy_mpa: 2100
    density_g_cm3: 1.04
    shrinkage_pct: 0.8       # typical linear shrinkage after cooling
    nozzle_temp_c: 260
    bed_temp_c: 100
    fan_pct: 80          # part cooling on small layers
    softening_c: 110       # Orca's temperature_vitrification
    heat_limit_c: 105      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: poor     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: null             # not in Prusament's immersion test; left unknown until a primary TDS is cited
    food_notes: "Not for food or drinks: ABS contains styrene and layer gaps trap bacteria. Use a food-contact certified material with a food-safe coating or liner instead."
    abrasion: null          # unverified across standard ABS datasheets
    oil_fuel: null          # oil/fuel immersion unverified on unfilled ABS
    solvent: poor           # Prusa ABS KB & Prusament chem study: dissolves rapidly in acetone
    skin: null              # standard hobby spools are not ISO 10993 skin-contact certified
  pa_cf:
    name: PA-CF (carbon fibre nylon)
    fibre: carbon            # chopped fibre filled: stiffer, not stronger (rules.yaml fibre_filled)
    max_overhang_deg: 45
    max_bridge_mm: 20
    min_layer_time_s: 10
    warp_risk: medium
    abrasive: true
    hygroscopic: high
    max_flow_mm3s: 8
    z_strength_factor: {none: 0.2, passive: 0.25, heated: 0.3}
    tensile_xy_mpa: 70
    modulus_xy_mpa: 4500
    density_g_cm3: 1.1
    shrinkage_pct: 0.3       # typical linear shrinkage after cooling
    nozzle_temp_c: 280
    bed_temp_c: 100
    fan_pct: 60          # part cooling on small layers
    softening_c: 108       # Orca's temperature_vitrification
    heat_limit_c: 120      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: fair     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: fair             # CNC Kitchen PA6 vs PA12 & Bambu PAHT-CF guide: PA6-CF softens heavily when wet, PA12/PA11 less so
    food_notes: "Do not use with food or drinks: carbon-fibre nylon is not food-contact grade and loose surface fibres can shed."
    abrasion: good          # Prusament PA11 CF: abrasion resistant, low coefficient of friction
    oil_fuel: good          # Prusament PA11 CF: resists motor oils, diesel, benzene
    solvent: good           # Prusament PA11 CF: resists acetone, methanol, ethanol, toluene, NaOH; Prusament chem study: PA excellent
    skin: poor              # Bambu ASA-CF/PAHT-CF guide: microscopic surface barbs; wear gloves when handling or sanding

  # Added in T-026 (typical TDS values: Polymaker, eSUN, Prusament; rough, for estimates only).
  pla_plus:
    name: PLA+
    max_overhang_deg: 55
    max_bridge_mm: 35
    min_layer_time_s: 8
    warp_risk: low
    abrasive: false
    hygroscopic: low
    max_flow_mm3s: 15
    z_strength_factor: {none: 0.6, passive: 0.6, heated: 0.6}  # eSUN PLA+ TDS: 31.2 MPa across the layers vs 53.34 along them (GB/T 1040) = 0.58
    tensile_xy_mpa: 50
    modulus_xy_mpa: 2600
    density_g_cm3: 1.24
    shrinkage_pct: 0.3
    nozzle_temp_c: 220
    bed_temp_c: 55
    fan_pct: 100          # part cooling on small layers
    softening_c: 45       # Orca's temperature_vitrification
    heat_limit_c: 60      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: poor     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: null             # proprietary PLA+ modifiers vary by brand
    food_notes: "Not food-safe straight off the printer: layer gaps hold bacteria, and PLA+ blends add unlisted modifiers. Use a food-contact certified spool with a food-safe coating or liner instead."
    abrasion: null          # proprietary blends vary by brand
    oil_fuel: null          # proprietary blends vary by brand
    solvent: null           # proprietary blends vary by brand
    skin: null              # proprietary blends vary by brand; not ISO 10993 certified
  asa:
    name: ASA
    max_overhang_deg: 45
    max_bridge_mm: 15
    min_layer_time_s: 10
    warp_risk: high
    abrasive: false
    hygroscopic: low
    max_flow_mm3s: 14
    z_strength_factor: {none: 0.35, passive: 0.55, heated: 0.7}
    tensile_xy_mpa: 40       # Polymaker PolyLite ASA 38.6, Bambu 37, Prusament 42 MPa (TDS)
    modulus_xy_mpa: 2000     # Polymaker 2175, Prusament 1600–1700 MPa (TDS)
    density_g_cm3: 1.07      # Prusament ASA TDS
    shrinkage_pct: 0.6
    nozzle_temp_c: 260
    bed_temp_c: 100
    fan_pct: 80          # part cooling on small layers
    softening_c: 110       # Orca's temperature_vitrification
    heat_limit_c: 100      # Polymaker PolyLite ASA: glass transition 97.8 °C, HDT 100 °C at 1.8 MPa
    uv_resistance: good     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: good             # Prusament chem study: resistant to water even during prolonged immersion
    food_notes: "Not for food or drinks: ASA contains styrene and layer gaps trap bacteria. Use a food-contact certified material with a food-safe coating or liner instead."
    abrasion: good          # Prusament ASA: high impact and wear resistance
    oil_fuel: null          # oil/fuel immersion unverified across generic ASA datasheets
    solvent: poor           # Prusament chem study & Prusament ASA: drops in ethanol/IPA, collapses in acetone
    skin: null              # standard hobby spools are not ISO 10993 skin-contact certified
  pc:
    name: PC (polycarbonate)
    max_overhang_deg: 40
    max_bridge_mm: 10
    min_layer_time_s: 10
    warp_risk: high
    abrasive: false
    hygroscopic: medium
    max_flow_mm3s: 13
    z_strength_factor: {none: 0.3, passive: 0.5, heated: 0.7}
    tensile_xy_mpa: 60       # Bambu PC 62, Prusament PC Blend 63, Polymaker PolyMax PC 53 MPa (TDS)
    modulus_xy_mpa: 2300     # Polymaker PolyMax PC 2150–2440 MPa (TDS)
    density_g_cm3: 1.2
    shrinkage_pct: 0.8
    nozzle_temp_c: 280
    bed_temp_c: 110
    fan_pct: 60          # part cooling on small layers
    softening_c: 120       # Orca's temperature_vitrification
    heat_limit_c: 145      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: fair     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: good             # Prusament chem study: PC Blend tensile & impact strength stable in room-temp water
    food_notes: "Not for food or drinks: standard PC filaments are not food-contact certified and layer gaps trap bacteria. Use a certified material with a food-safe coating or liner instead."
    abrasion: null          # unverified across standard PC filament datasheets
    oil_fuel: null          # oil/fuel immersion unverified (stress-cracking risk under load)
    solvent: fair           # Prusament chem study: stable in ethanol/IPA/acids/bleach, drops sharply in acetone
    skin: null              # standard desktop PC blends are not ISO 10993 skin-contact certified
  tpu_95a:
    name: TPU 95A (flexible)
    max_overhang_deg: 40
    max_bridge_mm: 8
    min_layer_time_s: 12
    warp_risk: low
    abrasive: false
    hygroscopic: medium
    max_flow_mm3s: 3         # flexible filament jams when pushed fast
    z_strength_factor: {none: 0.85, passive: 0.85, heated: 0.85}  # layers bond very well
    tensile_xy_mpa: 30       # Polymaker PolyFlex TPU95 29 MPa, Bambu TPU 95A HF 22 MPa (TDS)
    modulus_xy_mpa: 30       # Polymaker PolyFlex TPU95 TDS: Young's modulus 29 ± 2.8 MPa (ISO 527), 33.6 MPa in V5.5 (ISO 37); not the 9.4 MPa at 100 % stretch. The strength check is not meant for TPU
    density_g_cm3: 1.21
    shrinkage_pct: 0.5
    nozzle_temp_c: 240
    bed_temp_c: 35
    fan_pct: 100          # part cooling on small layers
    softening_c: 30       # Orca's temperature_vitrification
    heat_limit_c: 70      # loses most stiffness here (glass transition; approx., see note above materials)
    uv_resistance: fair     # outdoors in sunlight: good | fair | poor (see note above materials)
    water: fair             # Prusament TPU 95A: ether-diol resists hydrolysis well, while most ester-diol TPUs are less resistant
    food_notes: "Not food-safe straight off the printer: layer gaps hold bacteria, standard TPU spools are not food-contact certified, and rigid food-safe coatings crack when it flexes."
    abrasion: good          # Prusament TPU 95A: extreme wear resistance
    oil_fuel: fair          # Prusament TPU 95A: great resistance mostly to oil and grease; fuel resistance varies by grade
    solvent: null           # solvent immersion varies by TPU formulation; left unknown without a verified datasheet
    skin: null              # standard uncertified TPU spools are not ISO 10993 tested (additives vary by brand)

# speed: share of the 0.4 mm speeds in each nozzle's own slicer profile (OrcaSlicer's Bambu "Standard"
# process profiles, 2.x: outer wall 120 vs 200 mm/s, infill 100 vs 270 mm/s for 0.2, 0.6 and 0.8 mm;
# 1.0 mm uses the same +0.02 mm line width and 0.5× layer height convention, matching OrcaSlicer's Voron 1.0 mm profile).
nozzles:
  "0.2": {line_width: 0.22, layer_height: 0.1, speed: {outer_wall: 0.6, infill: 0.37}}
  "0.4": {line_width: 0.45, layer_height: 0.2}
  "0.6": {line_width: 0.62, layer_height: 0.3, speed: {outer_wall: 0.6, infill: 0.37}}
  "0.8": {line_width: 0.82, layer_height: 0.4, speed: {outer_wall: 0.6, infill: 0.37}}
  "1.0": {line_width: 1.02, layer_height: 0.5, speed: {outer_wall: 0.6, infill: 0.37}}

speeds:  # mm/s, typical defaults
  fast: {outer_wall: 200, infill: 270}
  medium: {outer_wall: 140, infill: 200}

# Knowledge base: what each finding means and how to fix it.
# Detection lives in code (fdmcore/checks.py); this file only explains and suggests.
# Each fix has a domain: geometry (edit the CAD model), slicer (settings), process (printer/material/handling).
# First draft generated with an LLM and reviewed by hand — corrections welcome.
# Entries with `sources` were drafted from research/sourced_*.yaml (links checked: research/url_check.txt).
rules:
  long_bridge:
    title: Long Unsupported Bridge Span
    why: The printer tries to stretch molten plastic across a large empty gap. Across long distances, the hot strands
      droop under gravity and leave a rough, stringy bottom surface.
    fixes:
    - domain: geometry
      text: Break up the span in CAD by adding an arch, 45-degree angled supports, or a center pillar.
    - domain: slicer
      text: Slow down bridge print speed and run the part cooling fan at full blast to freeze strands before they
        sag.
      settings:
        bridge_speed: '25'
        fan_max_speed: 100%
    - domain: slicer
      text: Enable supports directly beneath the open span so the bridging layers have a surface to rest on.
      settings:
        enable_support: '1'
        support_type: tree(auto)
    tags:
    - bridge
    - sagging
    - cooling
    - gap
  too_thin_to_print:
    title: Feature Too Thin to Extrude
    why: This detail is narrower than your printer nozzle's extrusion width. The slicer completely ignores it during
      slicing, so it will simply be missing from your finished print.
    fixes:
    - domain: geometry
      text: Thicken the feature in your CAD model to at least 0.45 mm so a standard nozzle can trace it.
    - domain: slicer
      text: Turn on the Arachne wall generator to dynamically taper extrusion lines down to finer widths.
      settings:
        wall_generator: arachne
    - domain: process
      text: Swap to a smaller 0.2 mm nozzle assembly to resolve ultra-fine features and tiny text.
    tags:
    - missing-features
    - fine-detail
    - nozzle-size
    - arachne
  small_bed_contact:
    title: Small Bed Contact Area
    why: The model has very little surface area touching the build plate compared to its overall volume. The weak
      grip easily breaks loose mid-print, causing a failed print.
    fixes:
    - domain: geometry
      text: Orient or redesign the model in CAD to create a broad, flat bottom surface for better adhesion.
    - domain: slicer
      text: Add an outer brim to extend the first layer footprint and anchor the part firmly to the build plate.
      settings:
        brim_type: outer_only
        brim_width: '5'
    - domain: process
      text: Wash the build plate thoroughly with warm water and dish soap to remove oily fingerprints that ruin
        adhesion.
    tags:
    - adhesion
    - bed-contact
    - brim
    - detachment
  tipping_risk:
    title: Tall Part Tipping Risk
    why: The part is tall and top-heavy relative to its narrow footprint on the print bed. As the bed shakes and
      the nozzle pushes against upper layers, the model can snap off the plate and tip over.
    fixes:
    - domain: geometry
      text: Rotate the part so it lies flat on its broadest side rather than standing upright.
    - domain: slicer
      text: Add a wide brim to anchor the base securely against leverage from tall movements.
      settings:
        brim_type: outer_only
        brim_width: '10'
    - domain: slicer
      text: Turn on tree supports to physically brace the tall structure against wobbling while printing.
      settings:
        enable_support: '1'
        support_type: tree(auto)
    tags:
    - tipping
    - stability
    - orientation
    - brim
  tall_thin_feature:
    title: Tall and Slender Feature Wobble
    why: A long, skinny pin or spire bends and wobbles back and forth as the nozzle pushes molten plastic onto it.
      This vibration creates messy layer lines, blobbing, or total failure.
    fixes:
    - domain: geometry
      text: Thicken the pin or add gussets and ribs around the base to stiffen it against bending forces.
    - domain: slicer
      text: Turn on tree supports around the tall column to physically brace it as it grows upward.
      settings:
        enable_support: '1'
        support_type: tree(auto)
    - domain: slicer
      text: Print it slower and let the slicer slow down small layers so the thin tip can cool and doesn't get pushed
        around.
      settings:
        slow_down_for_layer_cooling: '1'
    tags:
    - wobble
    - slender
    - tall-feature
    - stability
  small_layers_cooling:
    title: Small Layer Area Lacks Cooling Time
    why: Tiny tips and spires take only a second to print per layer. The nozzle stays right over the hot spot, turning
      the plastic into a melting, drooping blob before it can solidify.
    fixes:
    - domain: slicer
      text: Increase the minimum layer time setting so the printer slows down and lets tiny cross-sections cool.
      settings:
        slow_down_for_layer_cooling: '1'
        slow_down_layer_time: '8'
        fan_max_speed: 100%
    - domain: process
      text: Print two copies of the model or add a sacrificial throwaway tower on the bed to give each layer time
        to cool.
    - domain: geometry
      text: Avoid needle-thin vertical tips in CAD by rounding or blunting the top apex.
    tags:
    - cooling
    - small-layers
    - overheating
    - blobs
  enclosure_recommended:
    title: Warping-Prone Material on Open Printer
    why: Temperature-sensitive filaments like ABS or ASA need hot ambient air around the print. Cold room drafts
      make the upper layers contract rapidly, splitting layer seams and lifting the bottom.
    fixes:
    - domain: process
      text: Place the printer inside an enclosure tent or closed cabinet to trap heat and block room drafts.
    - domain: process
      text: Switch to an easier material like PETG or PLA that prints reliably in open room air without warping.
    - domain: slicer
      text: Add an outer brim and lower cooling fan speeds to keep the printed plastic as warm as possible.
      settings:
        brim_type: outer_only
        brim_width: '8'
        fan_max_speed: 20%
    - domain: geometry
      text: Round all sharp exterior base corners with large fillets in CAD to relieve draft-induced lifting tension.
    tags:
    - enclosure
    - drafts
    - abs
    - delamination
  hardened_nozzle_required:
    title: Abrasive Filament Needs Hardened Nozzle
    why: Filaments infused with carbon fiber, glass, glow-in-the-dark powder, or metal are abrasive. Standard brass
      nozzles wear out quickly, widening the hole and ruining print precision.
    fixes:
    - domain: process
      text: Swap out your stock brass nozzle for a hardened steel or ruby nozzle before loading abrasive filaments.
    - domain: process
      text: Switch to an unreinforced standard filament like neat PLA or PETG if you only have a brass nozzle.
    tags:
    - nozzle
    - abrasive
    - carbon-fiber
    - wear
  dry_filament:
    title: Moisture-Sensitive Filament Needs Drying
    why: Filaments like Nylon, PA-CF, TPU, and PETG absorb water directly out of humid air. The water boils inside
      the hot nozzle, causing loud popping, severe stringing, and weak prints.
    fixes:
    - domain: process
      text: Dry the filament spool in a dedicated filament dryer or food dehydrator before starting the print.
    - domain: process
      text: Feed the filament directly from an active heated drybox during long print sessions.
    - domain: process
      text: Store opened spools inside an airtight bin packed with fresh silica gel desiccant packs.
    tags:
    - moisture
    - drying
    - stringing
    - nylon
  stress_at_inside_corner:
    title: Stress Builds Up in a Sharp Inside Corner
    why: Where a stem, rib or wall meets the rest of the part at a sharp inside corner, the load has to turn the
      corner in a tiny area. The stress there is several times higher than in the rest of the part, so cracks start
      at the corner. A rounded or 45° fillet spreads the load over more material.
    fixes:
    - domain: geometry
      text: Add a 45° chamfer of 1–3 mm (more for big parts) where the two faces meet. Prefer a chamfer to a round
        fillet wherever it would print as an overhang.
    - domain: slicer
      text: More walls put more solid plastic around the corner.
      settings:
        wall_loops: '5'
    - domain: process
      text: Turn the part so the layers don't run across the corner, so the load doesn't pull the layers apart there.
    tags:
    - strength
    - fillet
    - stress-concentration
  too_hot_in_use:
    title: Gets Too Hot Where It's Used
    why: Printed plastic loses stiffness and strength as it warms up and goes soft near its glass transition
      (PLA around 60 °C, measured on printed PLA it keeps only about a quarter of its stiffness there). In a car
      in the sun, near a heater or a motor, it bends, sags or slowly creeps out of shape, even under small loads.
    fixes:
    - domain: process
      text: Print it in a material that takes more heat — PETG (~80 °C), ASA or ABS (~100 °C), PC (~145 °C).
    - domain: process
      text: Annealing some PLA blends in an oven raises their heat resistance, but the part shrinks and may warp;
        test with a spare print first.
    - domain: geometry
      text: Keep loads small and support the part well; thicker sections help a little, but not past the softening point.
    tags:
    - heat
    - material
    - creep
    sources:
    - Grasso et al. 2018, Effect of temperature on the mechanical properties of 3D-printed PLA tensile specimens,
      Rapid Prototyping Journal, https://doi.org/10.1108/RPJ-04-2017-0055
  side_detail_small:
    title: Text on an Upright Face Too Small or Too Deep
    why: On a face that stands upright when printed, the layers draw the detail one horizontal line at a time.
      Letters shorter than about 3 mm don't get enough layers for their horizontal strokes, and engraving deeper
      than about 0.8 mm leaves a small unsupported roof at the top of each letter that droops.
    fixes:
    - domain: geometry
      text: Make upright text at least 3–3.5 mm tall in a bold sans-serif font; engrave or raise it 0.4–0.6 mm,
        or give deeper engraving a 45° top edge.
    - domain: slicer
      text: Thinner layers (for example 0.12 mm) draw small upright text more cleanly.
      settings:
        layer_height: '0.12'
    - domain: process
      text: Turn the part so the text faces up, where the nozzle draws it instead of the layers.
    tags:
    - text
    - small-features
    - layer-height
    sources:
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
  shallow_relief:
    title: Raised or Engraved Detail Too Shallow
    why: Text, logos or other details raised from or sunk into a face that points up are only a layer or two high.
      The slicer cuts the part once per layer, so a step smaller than a layer may disappear or snap to the next
      layer, and one of under about 0.4 mm (two layers) reads only faintly.
    fixes:
    - domain: geometry
      text: Raise or sink the detail by 0.4–0.6 mm (2–3 layers at 0.2 mm). Use a bold sans-serif font with strokes
        at least 1.5 nozzle widths wide.
    - domain: slicer
      text: Print thinner layers (for example 0.12 mm) so the step covers more layers; variable layer height can do
        this only near the detail.
      settings:
        layer_height: '0.12'
    - domain: process
      text: For contrast, change the filament colour at the layer where the detail starts (a colour change / pause
        at that height).
    tags:
    - text
    - small-features
    - layer-height
    sources:
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  elephant_foot:
    title: Elephant Foot Flare on First Layers
    why: The weight of upper layers and heat from the build plate squish the initial bottom layers outward. This
      creates a flared bottom rim that ruins precise dimensional fits.
    fixes:
    - domain: slicer
      text: Enable elephant foot compensation in your slicer to pull the first-layer outline inward.
      settings:
        elefant_foot_compensation: '0.15'
    - domain: geometry
      text: Add a 0.5 mm by 45-degree chamfer around the bottom edges in CAD to absorb the initial squish.
    - domain: process
      text: Lower your heated bed temperature by 5 to 10 degrees to prevent the lower plastic layers from softening
        and bulging.
    tags:
    - elephant-foot
    - dimensional-accuracy
    - first-layer
    - tolerances
  exceeds_build_volume:
    title: Too big for your printer
    why: The part doesn't fit on the bed or under the gantry in this orientation, so the slicer will refuse to print
      it.
    fixes:
    - domain: process
      text: Try another orientation from the list — lying flat or diagonal often fits where upright doesn't.
    - domain: geometry
      text: Split the part into pieces that fit and join them with pins, dovetails or screws; put the cut where
        it is flat and not under load.
    - domain: process
      text: Scale it down if the exact size doesn't matter, or print it on a printer with a bigger build volume.
    tags:
    - size
    - build volume
  turned_to_fit:
    title: Turned on the bed to fit
    why: The part only fits when it is rotated around the vertical axis, so the tool turned it. The 3MF export already
      contains this rotation.
    fixes:
    - domain: process
      text: Keep the rotation when you open the 3MF; don't use "auto arrange" if it turns the part back.
    tags:
    - size
    - build volume
  support_marks:
    title: Rough Surface from Support Removal
    why: The CAD model shows a clean, flat underside, but the printed surface resting on supports will be rough,
      scarred, and droopy because single-material supports leave an air gap so they can break away.
    fixes:
    - domain: geometry
      text: Reorient the part to eliminate the overhang, or add 45-degree chamfers and gussets beneath the ledge
        so it supports itself cleanly without any support material.
    - domain: slicer
      text: If using a multi-material system, set the support interface material to an incompatible plastic (such
        as PETG interface for PLA, or PLA interface for PETG) to get a smooth, near-perfect bottom surface.
      settings:
        enable_support: '1'
        support_type: tree(auto)
        support_interface_pattern: rectilinear
    - domain: slicer
      text: In OrcaSlicer, "Make overhangs printable" turns steep overhangs into 45° slopes while slicing, so many of
        them need no support at all (the underside changes shape a little).
      settings:
        make_overhang_printable: '1'
    - domain: process
      text: Use a deburring tool, scraper, or fine sandpaper to clean up rough contact pockmarks left by support
        removal.
    tags:
    - support
    - surface-quality
    - overhang
    - interface
    sources:
    - Prusa Knowledge Base — Support material — https://help.prusa3d.com/article/support-material_1698
    - Slant 3D — How to Avoid Supports in 3D Printing — https://www.youtube.com/watch?v=cPKB6xX6hBA
    - Slant 3D — Stop Using Slicer Supports | Design for 3D Printing — https://www.youtube.com/watch?v=_R2E8VwyNz0
    - OrcaSlicer wiki — Overhangs (Make overhangs printable) — https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_overhangs
  trapped_support:
    title: Support Trapped Where It Can't Be Removed
    why: The CAD model shows a hollow internal pocket, a blind hole or a long narrow tunnel, but any support
      generated inside is sealed in or out of reach, with no way to pull it out. It leaves loose rattling debris,
      adds dead weight, blocks the hole or jams internal moving mechanisms.
    fixes:
    - domain: geometry
      text: Redesign the cavity ceiling with self-supporting 45-degree chamfers, arched domes, or teardrop profiles
        so the internal void prints cleanly across empty air without support structures.
    - domain: geometry
      text: Split the model into two pieces across the hollow chamber so the inside faces point upward during printing,
        then join them with alignment pins or glue.
    - domain: slicer
      text: Turn off supports or place support blocker volumes inside the cavity so the slicer does not generate
        unreachable internal support towers.
    tags:
    - support
    - internal-cavity
    - trapped-support
    - split-part
    sources:
    - Slant 3D — How to Avoid Supports in 3D Printing — https://www.youtube.com/watch?v=cPKB6xX6hBA
    - Slant 3D — 9 Design Rules for 3D Printing — https://www.youtube.com/watch?v=AD6L13tB1bE
    - Prusa Knowledge Base — Support material — https://help.prusa3d.com/article/support-material_1698
  bridge_sag:
    title: Sagging Bridge Ceiling in Horizontal Holes
    why: The CAD model shows a round hole or crisp rectangular slot, but gravity pulls down molten strands bridging
      mid-air across a 4 to 8 mm span, causing the top ceiling to sag 0.2 to 1 mm into the opening and turning round
      holes into undersized ovals.
    fixes:
    - domain: geometry
      text: Redesign the top of horizontal holes with a 90-degree or 120-degree teardrop peak, or add a flat-top
        bridge roof raised 0.3 mm above nominal diameter so bridge droop stays outside the fastener clearance.
    - domain: slicer
      text: Slow down bridge printing speed to let the cooling fan freeze molten strands instantly before gravity
        pulls them downward.
      settings:
        bridge_speed: '25'
    - domain: process
      text: Run a twist drill bit or round needle file through the horizontal hole after printing to clear out sagged
        ceiling strands.
    tags:
    - bridge
    - horizontal-holes
    - teardrop
    - sagging
    sources:
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  hole_starts_midair:
    title: Hole Starts in Mid-Air
    why: Where a smaller hole starts above an open space (the screw hole above a counterbore printed head-down, or a
      hole above a pocket), the first layer is a ring with a hole in it. The slicer has no edge to anchor the strands
      around the hole, so that layer droops into the space below and the start of the hole comes out ragged.
    fixes:
    - domain: geometry
      text: Add a sacrificial layer — one layer that closes the small hole where it starts. The layer below then bridges
        cleanly across the opening; poke or drill the thin skin open after printing. (The design panel can add it.)
    - domain: geometry
      text: Or turn the part over so the counterbore faces up; then the hole starts on solid plastic.
    - domain: slicer
      text: Enable support from the build plate only, so the ring gets support from below inside the open space.
      settings:
        enable_support: '1'
        support_on_build_plate_only: '1'
    tags:
    - bridge
    - counterbore
    - sacrificial-layer
    sources:
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
    - Prusa Knowledge Base — Support material — https://help.prusa3d.com/article/support-material_1698
  sideways_hole_oval:
    title: Sideways Hole Prints Oval
    why: A round hole that lies on its side prints its lower half like a normal wall, but the top half is built in
      mid-air over the hole. Those strands sag 0.2 to 0.4 mm (more above about 8 mm), so the hole comes out shorter
      top to bottom than in CAD and a pin, bearing or bolt of the nominal size jams.
    fixes:
    - domain: geometry
      text: Give the hole a teardrop top (a 45° point instead of the round ceiling), or make it 0.3–0.4 mm taller
        than the nominal size. The design panel can add the teardrop for you.
    - domain: slicer
      text: Slow down bridges and run the part fan at full speed over bridges so the ceiling strands set before they
        sag.
      settings:
        bridge_speed: '25'
    - domain: process
      text: Print the part so the hole points up (if the rest of the part allows), or ream the hole with a drill bit
        of the nominal size after printing.
    tags:
    - holes
    - horizontal-holes
    - bridge
    - teardrop
    sources:
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
  shrinkage_size_error:
    title: Long Part Comes Out Short
    why: Plastic shrinks as it cools from printing temperature, so a long part ends up a little smaller than in
      CAD — about 0.3% for PLA and up to 0.8% or more for ABS, ASA and PC. On a 200 mm part that's up to 1.6 mm,
      enough that it no longer fits its mating part.
    fixes:
    - domain: slicer
      text: Set the filament's shrinkage compensation in the slicer (OrcaSlicer, Filament settings, Shrinkage) to the
        value measured on a calibration print, or scale the part up by the shrinkage percentage.
    - domain: geometry
      text: Leave clearance at long mating edges, or add the expected shrinkage to the critical dimensions in CAD.
    - domain: process
      text: Print a test bar of the same material, measure it and use that shrinkage; it varies by brand and colour.
    tags:
    - shrinkage
    - tolerances
    - dimensions
    sources:
    - Prusa Knowledge Base — dimensional accuracy and shrinkage articles (help.prusa3d.com)
    - Polymaker PolyLite ABS / ASA technical data sheets (shrinkage values)
  gap_fuses:
    title: Moving Clearance Gap Fuses Shut
    why: The CAD model shows separate moving components in a print-in-place hinge or bearing, but clearances narrower
      than 0.2 mm will weld together into a solid block because molten plastic bulges outward under extrusion pressure
      and bridges the gap.
    fixes:
    - domain: geometry
      text: Increase the clearance gap in CAD to at least 0.3 to 0.4 mm between moving faces, and angle facing surfaces
        at 45 degrees so adjacent layers never bridge directly across from each other.
    - domain: slicer
      text: Switch to the Arachne wall generator to dynamically taper extrusion lines in tight spaces, and apply
        slight positive hole compensation to pull back boundaries.
      settings:
        wall_generator: arachne
        xy_hole_compensation: '0.05'
    - domain: process
      text: Gently work the joint back and forth with pliers right after cooling to crack any tiny plastic strings
        bridging across the gap.
    tags:
    - print-in-place
    - clearance
    - tolerances
    - hinges
    sources:
    - Maker's Muse — Clearance and Tolerance 3D Printing Gauge — https://www.youtube.com/watch?v=TYuLVN3YHw8
    - Maker's Muse — How to Design Print-in-Place Hinges — https://www.youtube.com/watch?v=fbSQvJJjw2Q
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
  hole_closes:
    title: Tiny Hole Closes Up
    why: The CAD model shows an open pinhole or wire passage, but vertical holes smaller than 1.5 mm diameter close
      up or disappear because nozzle surface tension drags hot plastic inward around tight circles and overlapping
      walls choke the opening.
    fixes:
    - domain: geometry
      text: Enlarge small holes in CAD to at least 2.0 mm diameter, or model them as faceted polygons (polyholes)
        so the nozzle extrudes short straight segments instead of pulling loops inward.
    - domain: slicer
      text: Enable the Arachne wall generator to dynamically thin extrusion lines around miniature perimeters, and
        apply positive hole compensation.
      settings:
        wall_generator: arachne
        xy_hole_compensation: '0.15'
    - domain: process
      text: Ream the closed hole open after printing using a small twist drill bit or a 1.5 mm pin vise.
    - domain: process
      text: Swap to a smaller 0.2 mm nozzle assembly that can trace tiny inner perimeters without crowding into
        the center of the bore.
    tags:
    - holes
    - small-features
    - polyholes
    - nozzle-size
    sources:
    - '"Nophead (Chris Palmer) — Hydraraptor: Polyholes — https://hydraraptor.blogspot.com/2011/02/polyholes.'
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
  small_hole_undersized:
    title: Small Hole Prints Undersized
    why: The CAD model has an exact diameter hole for a bolt or pin, but vertical holes up to 6 mm print 0.15 to
      0.3 mm too small because molten plastic is pulled inward around tight curves and STL polygon export cuts across
      circle chords, preventing screws from fitting.
    fixes:
    - domain: geometry
      text: Oversize vertical fastener holes in CAD by +0.2 to +0.3 mm (for example, design M3 clearance holes at
        3.3 to 3.4 mm), or use Nophead's polyhole polygon formula.
    - domain: slicer
      text: Apply positive X-Y hole compensation in your slicer to automatically offset inner hole perimeters outward.
      settings:
        xy_hole_compensation: '0.15'
    - domain: process
      text: Clean out undersized holes with a drill bit sized for your fastener or use a hand reamer for a precise
        sliding fit.
    tags:
    - holes
    - tolerances
    - shrinkage
    - fasteners
    sources:
    - 'Nophead (Chris Palmer) — Hydraraptor: Polyholes — https://hydraraptor.blogspot.com/2011/02/polyholes.html'
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - OrcaSlicer Wiki — Precise wall — https://github.com/SoftFever/OrcaSlicer/wiki/Precise-wall
  nut_trap_tight:
    title: Nut Trap Too Tight for the Nut
    why: A hexagonal pocket modelled at the nut's exact size prints a little small, like every printed hole, so the
      nut won't go in or cracks the walls when forced. Nut traps need about 0.2–0.3 mm more across the flats than the
      nut (an M3 nut is 5.5 mm, so 5.7–5.8 mm).
    fixes:
    - domain: geometry
      text: Make the hexagon 0.2–0.3 mm bigger across the flats than the nut (M3 5.7–5.8 mm, M4 7.2–7.3 mm), and the
        pocket a little deeper than the nut is thick.
    - domain: slicer
      text: Positive X-Y hole compensation opens all holes, nut traps included, a little.
      settings:
        xy_hole_compensation: '0.15'
    - domain: process
      text: Pull the nut in with a screw from the other side, or press it in with a soldering iron set low.
    tags:
    - holes
    - tolerances
    - fasteners
    sources:
    - OpenFlexure — nut trap sizes from ISO 4032 — https://gitlab.com/openflexure/openflexure-microscope/-/merge_requests/371
    - fb-library — Bolt fittings — https://fb-library.readthedocs.io/en/latest/bolt_fittings/
  insert_wall_thin:
    title: Thin Wall Around a Heat-Set Insert
    why: A heat-set insert is pressed in hot and pushes the melted plastic outwards. With less than about 1.6 mm of
      plastic around the hole, the wall bulges, splits, or lets the insert pull out under load.
    fixes:
    - domain: geometry
      text: Give the hole about 2 mm of wall all round (a boss around twice the insert's diameter), and make it about
        1 mm deeper than the insert is long.
    - domain: slicer
      text: Print more walls so the plastic around the insert is solid, not infill.
      settings:
        wall_loops: '4'
    - domain: process
      text: Press the insert in slowly at the temperature the insert maker gives, so it melts its way in instead of
        pushing the wall apart.
    tags:
    - holes
    - fasteners
    - strength
    sources:
    - CNC Kitchen — Tips & Tricks for Heat-Set Inserts — https://cnckitchen.com/blog/tips-and-tricks-for-heat-set-inserts
    - DigiKey Maker.io — How to use heat-set inserts — https://www.digikey.com/es/maker/tutorials/2025/intro-to-freecad-part-4-how-to-use-heat-set-inserts
    - Sovol — Design strong screw bosses for heat-set inserts — https://www.sovol3d.com/blogs/news/3d-printing-with-heat-set-inserts-design-strong-screw-bosses-that-last
  first_layer_detail:
    title: Fine Detail Squashed on Bed Surface
    why: The CAD model shows crisp letters, logos, or shallow grooves on the bottom face, but on the finished print
      they get squashed shut or blurred into illegible mush by first-layer bed squish and elephant foot bulge.
    fixes:
    - domain: geometry
      text: Deboss text into the bottom face by at least 0.4 to 0.6 mm using wide, bold sans-serif fonts with stroke
        widths of at least 0.8 mm, or move fine logos onto top or vertical side faces.
    - domain: slicer
      text: Increase elephant foot compensation in your slicer to pull the first-layer perimeter inward and keep
        recessed lines open.
      settings:
        elefant_foot_compensation: '0.20'
    - domain: process
      text: Calibrate first-layer Z-offset and lower bed temperature by 5 degrees after the first layer so bottom
        plastic does not soften and bulge under the weight of upper layers.
    tags:
    - elephant-foot
    - text
    - first-layer
    - fine-detail
    sources:
    - Prusa Knowledge Base — Elephant foot compensation — https://help.prusa3d.com/article/elephant-foot-compensation_114487
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
    - Slant 3D — How to Design Parts for 3D Printing (Fillets & Chamfers) — https://www.youtube.com/watch?v=9JqN2aFBa2w
  fine_detail_rough:
    title: Positive Detail Too Fine for Nozzle
    why: The CAD model features delicate text strokes, thin ribs, or pointy pins, but positive details narrower
      than 1.5 times nozzle width print rough, jagged, or missing entirely because a standard nozzle cannot trace
      both walls of such a thin feature.
    fixes:
    - domain: geometry
      text: Thicken positive features and text stroke widths in CAD to at least 0.6 to 0.8 mm, and choose bold sans-serif
        typefaces without fine tapered tips.
    - domain: slicer
      text: Turn on the Arachne wall generator to dynamically taper extrusion lines down to fine tips, and lower
        layer height to sharpen vertical resolution.
      settings:
        wall_generator: arachne
        layer_height: '0.12'
    - domain: process
      text: Swap to a smaller 0.2 mm nozzle assembly on your printer to lay down narrower extrusion tracks and capture
        miniature features cleanly.
    tags:
    - fine-detail
    - text
    - arachne
    - nozzle-size
    sources:
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  warping:
    title: Long Base Corners Lifting from Bed
    why: The CAD model has a flat, square base, but the printed part will lift and curl up at the corners like a
      banana because cooling plastic contracts along the long base and pulls sharp corners clean off the build plate.
    fixes:
    - domain: geometry
      text: Round sharp exterior base corners with large fillets (3 mm radius or larger), or add circular mouse-ear
        pads at the corners in CAD to disperse lifting tension.
    - domain: slicer
      text: Add mouse-ear brims or a wide outer brim to clamp down the corners, and choose Gyroid infill at moderate
        density to balance internal shrinkage forces in all directions.
      settings:
        brim_type: brim_ears
        brim_width: '8'
        sparse_infill_pattern: gyroid
        sparse_infill_density: 15%
    - domain: process
      text: Enclose the printer to keep ambient air warm, preheat the bed for 10 minutes before printing, and wash
        the build sheet with warm water and dish soap to ensure maximum adhesion.
    tags:
    - warping
    - bed-adhesion
    - brim
    - mouse-ears
    sources:
    - CNC Kitchen — How to Prevent Warping in 3D Printing — https://www.youtube.com/watch?v=HNAtHl6kB7Y
    - 'OrcaSlicer Wiki — Others Settings: Brim type (Mouse ear) — https://github.com/SoftFever/OrcaSlicer/wiki/other_settings_brim'
    - Bambu Lab Wiki — ASA CF / PAHT CF Usage Guide — https://wiki.bambulab.com/en/filament/asacf_pahtcf
  weak_upright_pin:
    title: Upright Pin Weak Along Layer Seams
    why: The CAD model shows a solid pin, clip, or peg, but printed standing upright it will snap off under the
      slightest sideways bump because horizontal layer lines run right across the narrow stem, putting weak layer
      seams under pure bending load.
    fixes:
    - domain: geometry
      text: Reorient the part to print the pin lying flat on the build plate so continuous perimeter strands run
        lengthwise, add a generous fillet at the pin root, or design an internal bore to press in a steel dowel
        pin or screw.
    - domain: slicer
      text: Increase wall loops so the pin is printed entirely as solid concentric perimeters, and lower layer height
        to pack more bonded surface area into the column.
      settings:
        wall_loops: '6'
        layer_height: '0.12'
    - domain: process
      text: Print at the upper end of your filament's recommended nozzle temperature and reduce cooling fan speed
        to improve molecular bonding between layers.
    tags:
    - strength
    - orientation
    - pins
    - layer-adhesion
    sources:
    - CNC Kitchen — The Influence of Extrusion Temperature on Layer Adhesion — https://www.cnckitchen.com/blog/the-influence-of-extrusion-temperature-on-layer-adhesion
    - Slant 3D — Design Unbreakable Pins with Perfect Tolerances — https://www.youtube.com/watch?v=uMA-Wt-z_BU
    - Slant 3D — Make a Pin that Doesn't Break. Use Ripples — https://www.youtube.com/shorts/njTfpxL71zk
  thin_neck:
    title: High Load Concentration Across Thin Neck
    why: The CAD model shows a narrow waist between two thicker sections, but under any real-world load the printed
      part will snap right across the neck because all pulling and twisting stress concentrates into just a few
      small layer bonds.
    fixes:
    - domain: geometry
      text: Thicken the narrow neck in CAD, add triangular gusset ribs, and use large transitional fillets (3 mm
        radius or larger) to blend the neck smoothly into the larger sections and eliminate sharp stress-raising
        notches.
    - domain: slicer
      text: Increase wall loops so the entire narrow neck is filled with dense solid perimeters rather than sparse
        internal infill.
      settings:
        wall_loops: '6'
        sparse_infill_pattern: gyroid
        sparse_infill_density: 30%
    - domain: process
      text: Reorient the part on the bed so primary pulling and bending forces run along continuous extruded strands
        rather than pulling across layer lines.
    tags:
    - strength
    - stress-concentration
    - fillets
    - perimeters
    sources:
    - CNC Kitchen — INFILL pattern and SHELLS - How to get the maximum STRENGTH out of your 3D prints? — https://www.cnckitchen.com/blog/infill-pattern-and-shells-how-to-get-the-maximum-strength-out-of-your-3d-prints
    - Rahix — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
    - CNC Kitchen — The Influence of Extrusion Temperature on Layer Adhesion — https://www.cnckitchen.com/blog/the-influence-of-extrusion-temperature-on-layer-adhesion
  single_line_wall:
    title: Fragile Wall with Single Perimeter
    why: The CAD model shows a solid wall, but because it is thinner than two nozzle extrusion passes (under 0.8
      mm on a 0.4 mm nozzle), the slicer only lays down a single flimsy bead of plastic, leaving the wall brittle,
      full of pinholes, and easily cracked along layer seams.
    fixes:
    - domain: geometry
      text: Thicken the wall in CAD to at least 1.2 mm (or at least 0.85 mm for a 0.4 mm nozzle) so the slicer fits
        inner and outer perimeter loops with solid overlap.
    - domain: slicer
      text: Turn on the Arachne wall generator to dynamically widen extrusion paths and eliminate hollow gaps in
        thin sections.
      settings:
        wall_generator: arachne
        wall_loops: '3'
    - domain: process
      text: If thin walls are required by your design, install a smaller 0.2 mm nozzle assembly so multiple perimeter
        passes can fit inside the narrow wall thickness.
    tags:
    - thin-wall
    - perimeters
    - strength
    - arachne
    sources:
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
    - CNC Kitchen — INFILL pattern and SHELLS - How to get the maximum STRENGTH out of your 3D prints? — https://www.cnckitchen.com/blog/infill-pattern-and-shells-how-to-get-the-maximum-strength-out-of-your-3d-prints

# Knowledge base: what each finding means and how to fix it.
# Detection lives in code (fdmcore/checks.py); this file only explains and suggests.
# Each fix has a domain: geometry (edit the CAD model), slicer (settings), process (printer/material/handling).
# First draft generated with an LLM and reviewed by hand — corrections welcome.
# Entries with `sources` were drafted from research/sourced_*.yaml (links checked: research/url_check.txt).
rules:
  long_bridge:
    title: Long bridge with nothing underneath
    why: This is a long horizontal span with no support underneath. Molten plastic strands droop across the gap, leaving
      a rough, stringy bottom surface.
    fixes:
    - domain: geometry
      text: Break up the span in CAD by adding an arch, 45-degree angled supports, or a center pillar.
    - domain: slicer
      text: Slow down bridge print speed and run the part cooling fan at full blast to freeze strands before they
        sag.
      settings:
        bridge_speed: '25'
        fan_max_speed: 100%
    - domain: slicer
      text: Enable supports directly beneath the open span so the bridging layers have a surface to rest on.
      settings:
        enable_support: '1'
        support_type: tree(auto)
    tags:
    - bridge
    - sagging
    - cooling
    - gap
    sources:
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
    - OrcaSlicer Wiki — Bridging — https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_bridging
    - Teaching Tech — 3D printer calibration: bridging — https://teachingtechyt.github.io/calibration.html#bridging
  too_thin_to_print:
    title: Too thin to print
    why: This feature is thinner than the printer nozzle's extrusion width. The slicer ignores it, so it will be missing
      from the finished print.
    fixes:
    - domain: geometry
      text: Thicken the feature in your CAD model to at least 0.45 mm so a standard nozzle can trace it.
    - domain: slicer
      text: Turn on the Arachne wall generator to dynamically taper extrusion lines down to finer widths.
      settings:
        wall_generator: arachne
    - domain: process
      text: Swap to a smaller 0.2 mm nozzle assembly to resolve ultra-fine features and tiny text.
    tags:
    - missing-features
    - fine-detail
    - nozzle-size
    - arachne
    sources:
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  small_bed_contact:
    title: Small contact with the bed
    why: Very little surface area touches the build plate compared to the size of the part. The weak grip can easily
      break loose mid-print and ruin the print.
    fixes:
    - domain: geometry
      text: Orient or redesign the model in CAD to create a broad, flat bottom surface for better adhesion.
    - domain: slicer
      text: Add an outer brim to extend the first layer footprint and anchor the part firmly to the build plate.
      settings:
        brim_type: outer_only
        brim_width: '5'
    - domain: process
      text: Wash the build plate thoroughly with warm water and dish soap to remove oily fingerprints that ruin
        adhesion.
    tags:
    - adhesion
    - bed-contact
    - brim
    - detachment
    sources:
    - Prusa Knowledge Base — Skirt and Brim (brim for tall objects with a small base) — https://help.prusa3d.com/article/skirt-and-brim_133969
    - OrcaSlicer Wiki — Brim — https://github.com/OrcaSlicer/OrcaSlicer/wiki/others_settings_brim
  print_may_fail:
    title: The print may fail on the bed
    why: Several things add up on this part (corners that lift, little contact with the bed, a tall narrow shape, a
      shrinking plastic on an open printer). Each alone is often fine; together the part tends to come loose or fall
      over partway through, and the whole print is lost.
    fixes:
    - domain: geometry
      text: Turn the part so a wider, flatter side lies on the bed, or round the sharp corners of the base.
    - domain: slicer
      text: An outer brim holds the edges down. Where the base is tiny and the part also warps or tips, print it on a raft (a
        few layers of plastic under the part, cut off after printing).
      settings:
        raft_layers: '3'
    - domain: process
      text: Clean the bed with soap and water, use glue stick for PETG and ABS, keep drafts away, and close the
        enclosure for ABS, ASA and PC.
    tags:
    - bed adhesion
    - warping
    - stability
    sources:
    - Prusa Knowledge Base — Warping — https://help.prusa3d.com/en/article/warping_2011/
    - All3DP — 3D Printing Raft: When Should You Use It? — https://all3dp.com/2/3d-printing-raft-when-should-you-use-it/
    - Prusa Knowledge Base — Layer separation and splitting — https://help.prusa3d.com/article/layer-separation-and-splitting-fdm_1806
  tipping_risk:
    title: Tall part can tip over
    why: The part is tall and top-heavy over a narrow base on the bed. Nozzle pressure and bed motion can knock it loose
      and tip it over.
    fixes:
    - domain: geometry
      text: Rotate the part so it lies flat on its broadest side rather than standing upright.
    - domain: slicer
      text: Add a wide outer brim to anchor the base securely against leverage from tall movements.
      settings:
        brim_type: outer_only
        brim_width: '10'
    - domain: slicer
      text: Turn on tree supports to physically brace the tall structure against wobbling while printing.
      settings:
        enable_support: '1'
        support_type: tree(auto)
    tags:
    - tipping
    - stability
    - orientation
    - brim
    sources:
    - Prusa Knowledge Base — Skirt and Brim (brim for tall objects with a small base) — https://help.prusa3d.com/article/skirt-and-brim_133969
  tall_thin_feature:
    title: Tall, thin part wobbles
    why: This tall, slender section bends and wobbles as the nozzle pushes against it. The movement causes messy layer
      lines, blobs, or print failure.
    fixes:
    - domain: geometry
      text: Thicken the pin or add triangular support ribs around the base to stiffen it against bending forces.
    - domain: slicer
      text: Turn on tree supports around the tall column to physically brace it as it grows upward.
      settings:
        enable_support: '1'
        support_type: tree(auto)
    - domain: slicer
      text: Print it slower and let the slicer slow down small layers so the thin tip can cool and doesn't get pushed
        around.
      settings:
        slow_down_for_layer_cooling: '1'
    tags:
    - wobble
    - slender
    - tall-feature
    - stability
    sources:
    - Prusa Knowledge Base — Skirt and Brim (brim for tall objects with a small base) — https://help.prusa3d.com/article/skirt-and-brim_133969
  small_layers_cooling:
    title: Small layers don't cool in time
    why: These narrow layers take only a second to print. The nozzle stays over the hot plastic, turning it into a melting,
      drooping blob before it can solidify.
    fixes:
    - domain: slicer
      text: "Increase minimum layer time and lower the filament's minimum print speed (OrcaSlicer: Cooling → Min print speed) so short layers have time to cool before the next layer lands."
      settings:
        slow_down_for_layer_cooling: '1'
        slow_down_layer_time: '8'
        fan_max_speed: 100%
    - domain: process
      text: Print two copies of the model or add a sacrificial throwaway tower on the bed to give each layer time
        to cool.
    - domain: geometry
      text: Avoid needle-thin vertical tips in CAD by rounding or blunting the top apex.
    tags:
    - cooling
    - small-layers
    - overheating
    - blobs
    sources:
    - Prusa Knowledge Base — Max volumetric speed (Layer time cooldown) — https://help.prusa3d.com/article/max-volumetric-speed_127176
    - OrcaSlicer Wiki — Material cooling — https://github.com/OrcaSlicer/OrcaSlicer/wiki/material_cooling
  heat_too_hot:
    title: Spot stays too hot
    why: This spot gets the next layer while it is still soft from the last one, so it can sag, blob or lose its
      sharp shape. Small or thin areas stay hot because each of their layers prints so quickly.
    fixes:
    - domain: slicer
      text: Give each layer more time to cool. Raise the minimum layer time and let the printer slow down for
        small layers, with the part fan at full speed.
      settings:
        slow_down_for_layer_cooling: '1'
        slow_down_layer_time: '10'
        fan_max_speed: 100%
    - domain: process
      text: Print a second copy of the part, or a small throwaway tower, on the same plate. The nozzle then leaves
        this spot for a while every layer, and it cools in the meantime.
    - domain: geometry
      text: Make the thin feature thicker, or join it to a bigger part of the model.
    tags:
    - cooling
    - overheating
    - sagging
    sources:
    - OrcaSlicer Wiki — Material cooling — https://github.com/OrcaSlicer/OrcaSlicer/wiki/material_cooling
    - Prusa Knowledge Base — Max volumetric speed (Layer time cooldown) — https://help.prusa3d.com/article/max-volumetric-speed_127176
  heat_weak_bond:
    title: Layers cool too much to bond well
    why: Each new layer lands on plastic that has already cooled a lot, for example under a strong fan on big
      layers. The layers then fuse only partly, and the part breaks more easily along its layers.
    fixes:
    - domain: slicer
      text: Turn the part cooling fan down for this part, as far as the material allows, so the layer below is
        still warm when the next one lands.
      settings:
        fan_min_speed: 20%
        fan_max_speed: 60%
    - domain: slicer
      text: Print 5–10 °C hotter, so each new layer brings more heat into the joint with the one below.
    - domain: process
      text: Print in an enclosure, or close the printer's door, so the part cools less between layers.
    tags:
    - cooling
    - bonding
    - strength
    sources:
    - Seppala et al. 2017, Weld formation during material extrusion additive manufacturing, Soft Matter 13:6761
      — https://doi.org/10.1039/c7sm00950j
    - OrcaSlicer Wiki — Material cooling — https://github.com/OrcaSlicer/OrcaSlicer/wiki/material_cooling
  heat_needless_slowdown:
    title: Slowed down for cooling it doesn't need
    why: The slicer slows these layers down so they can cool, but they already end up too cool to bond well. The
      slow-down costs print time and makes the part weaker here.
    fixes:
    - domain: slicer
      text: Lower the minimum layer time, so these layers print at their normal speed.
      settings:
        slow_down_layer_time: '4'
    - domain: slicer
      text: Turn the part cooling fan down for this part instead of slowing it down.
      settings:
        fan_max_speed: 60%
    tags:
    - cooling
    - speed
    - bonding
    sources:
    - OrcaSlicer Wiki — Material cooling — https://github.com/OrcaSlicer/OrcaSlicer/wiki/material_cooling
  enclosure_recommended:
    title: This material warps on an open printer
    why: Temperature-sensitive filaments like ABS or ASA need warm ambient air to print properly. Cold drafts cause
      layers to shrink quickly, splitting layer seams and lifting the base.
    fixes:
    - domain: process
      text: Place the printer inside an enclosure tent or closed cabinet to trap heat and block room drafts.
    - domain: process
      text: Switch to an easier material like PETG or PLA that prints reliably in open room air without warping.
    - domain: slicer
      text: Add an outer brim and lower cooling fan speeds to keep the printed plastic as warm as possible.
      settings:
        brim_type: outer_only
        brim_width: '8'
        fan_max_speed: 20%
    - domain: geometry
      text: Round all sharp exterior base corners with large fillets in CAD to relieve draft-induced lifting tension.
    tags:
    - enclosure
    - drafts
    - abs
    - delamination
    sources:
    - CNC Kitchen — Understand WHY 3D prints WARP — https://www.youtube.com/watch?v=HNAtHl6kB7Y
    - Bambu Lab Wiki — ASA CF / PAHT CF Usage Guide (enclosed chamber, hardened steel nozzle only) — https://wiki.bambulab.com/en/filament/asacf_pahtcf
  hardened_nozzle_required:
    title: Abrasive filament needs a hardened nozzle
    why: Filaments with carbon fiber, glass, or metal particles are abrasive. They quickly wear out standard brass nozzles,
      widening the hole and ruining print precision.
    fixes:
    - domain: process
      text: Swap out your stock brass nozzle for a hardened steel or ruby nozzle before loading abrasive filaments.
    - domain: process
      text: Switch to an unreinforced standard filament like neat PLA or PETG if you only have a brass nozzle.
    tags:
    - nozzle
    - abrasive
    - carbon-fiber
    - wear
    sources:
    - Bambu Lab Wiki — ASA CF / PAHT CF Usage Guide (enclosed chamber, hardened steel nozzle only) — https://wiki.bambulab.com/en/filament/asacf_pahtcf
  dry_filament:
    title: Filament needs drying first
    why: Filaments like Nylon, TPU, and PETG absorb moisture from humid air. Trapped water boils inside the hot nozzle,
      causing popping, stringing, and weak prints.
    fixes:
    - domain: process
      text: Dry the filament spool in a dedicated filament dryer or food dehydrator before starting the print.
    - domain: process
      text: Feed the filament directly from an active heated drybox during long print sessions.
    - domain: process
      text: Store opened spools inside an airtight bin packed with fresh silica gel desiccant packs.
    tags:
    - moisture
    - drying
    - stringing
    - nylon
    sources:
    - Bambu Lab Wiki — Filament Drying Recommendations — https://wiki.bambulab.com/en/filament-acc/filament/dry-filament
  stress_at_inside_corner:
    title: Sharp inside corner can crack
    why: A sharp inside corner puts more stress in one spot. For a load applied once or held steady, tests on
      printed PLA disagree on how much rounding helps (from almost nothing to about half the strength back). It
      matters more for clips, hinges and brackets that flex or shake over and over. Start by turning the part so the
      load runs along the layers.
    fixes:
    - domain: geometry
      text: Try a 1–3 mm round where it prints without support, such as at the base of an upright stem.
        Where the round would hang over, under a ledge or ceiling, try a self-supporting 45° chamfer.
    - domain: slicer
      text: More walls put more solid plastic around the corner.
      settings:
        wall_loops: '5'
    - domain: process
      text: Print the part so the load runs along the layers and is less likely to pull them apart at the corner.
    tags:
    - strength
    - fillet
    - stress-concentration
    sources:
    - 'Printed Solid — 3D Printing Design Tips, Part 1: Stress Concentrations — https://www.printedsolid.com/blogs/news/37036739-3d-printing-design-tips-part-1-stress-concentrations'
    - Zabihollah et al. (2024) — Tensile stress concentration factors of printed PLA (fillet radius, hole size, infill) — https://doi.org/10.4028/p-9hyd0a
    - Seifollahi and Kabir (2026) — Static and repeated loading of printed PLA with notches and holes — https://doi.org/10.3390/polym18010001
    - Ezeh and Susmel (2020) — Repeated loading of printed PLA with blunt and sharp notches — https://eprints.whiterose.ac.uk/158161/1/PLA_Notch_Fatigue_Accpeted%20Manuscript_LS.pdf
    - Materials (2024) — Print direction and strength under pin loading in PLA — https://doi.org/10.3390/ma17225394
    - ETASR (2025) — FEA of shoulder fillets, chamfers and key-seats under tension, torsion and bending (fillets give the lowest stress concentration) — https://etasr.com/index.php/ETASR/article/download/11111/5430/62291
    - Rahix — Design for 3D-Printing (fillets vs chamfers by print direction) — https://blog.rahix.de/design-for-3d-printing/
  too_hot_in_use:
    title: Gets too hot where it's used
    why: Printed plastic softens and loses stiffness near its softening temperature, around 60 °C for PLA. Heat
      makes the printed part bend, sag, or creep out of shape under load.
    fixes:
    - domain: process
      text: Print it in a material that takes more heat — PETG (~80 °C), ASA or ABS (~100 °C), PC (~145 °C).
    - domain: process
      text: Annealing some PLA blends in an oven raises their heat resistance, but the part shrinks and may warp;
        test with a spare print first.
    - domain: geometry
      text: Keep loads small and support the part well; thicker sections help a little, but not past the softening point.
    tags:
    - heat
    - material
    - creep
    sources:
    - Grasso et al. 2018, Effect of temperature on the mechanical properties of 3D-printed PLA tensile specimens,
      Rapid Prototyping Journal, https://doi.org/10.1108/RPJ-04-2017-0055
  side_detail_small:
    title: Side text too fine
    why: Letters on an upright face shorter than 3 mm lack enough layers for clear horizontal strokes. Engraving deeper
      than 0.8 mm leaves an unsupported roof that droops.
    fixes:
    - domain: geometry
      text: Make upright text at least 3–3.5 mm tall in a bold sans-serif font; engrave or raise it 0.4–0.6 mm,
        or give deeper engraving a 45° top edge.
    - domain: slicer
      text: Thinner layers (for example 0.12 mm) draw small upright text more cleanly.
      settings:
        layer_height: '0.12'
    - domain: process
      text: Turn the part so the text faces up, where the nozzle draws it instead of the layers.
    tags:
    - text
    - small-features
    - layer-height
    sources:
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
  shallow_relief:
    title: Raised or engraved detail too shallow
    why: This raised or engraved detail on a top face is only a layer or two high. Steps smaller than a layer can vanish
      during slicing, and details under 0.4 mm print very faintly.
    fixes:
    - domain: geometry
      text: Raise or sink the detail by 0.4–0.6 mm (2–3 layers at 0.2 mm). Use a bold sans-serif font with strokes
        at least 1.5 nozzle widths wide.
    - domain: slicer
      text: Print thinner layers (for example 0.12 mm) so the step covers more layers; variable layer height can do
        this only near the detail.
      settings:
        layer_height: '0.12'
    - domain: process
      text: For contrast, change the filament colour at the layer where the detail starts (a colour change / pause
        at that height).
    tags:
    - text
    - small-features
    - layer-height
    sources:
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  elephant_foot:
    title: First layers bulge out (elephant foot)
    why: Bed heat and the weight of upper layers squish the bottom layers outward. This creates a flared bottom rim
      that ruins accurate dimensions at the base.
    fixes:
    - domain: slicer
      text: Enable elephant foot compensation in your slicer to pull the first-layer outline inward.
      settings:
        elefant_foot_compensation: '0.15'
    - domain: geometry
      text: Add a 0.5 mm by 45-degree chamfer around the bottom edges in CAD to absorb the initial squish.
    - domain: process
      text: Lower your heated bed temperature by 5 to 10 degrees to prevent the lower plastic layers from softening
        and bulging.
    tags:
    - elephant-foot
    - dimensional-accuracy
    - first-layer
    - tolerances
    sources:
    - Prusa Knowledge Base — Elephant foot compensation — https://help.prusa3d.com/article/elephant-foot-compensation_114487
  exceeds_build_volume:
    title: Too big for your printer
    why: The part is larger than the printer's build volume in this orientation. The slicer cannot fit it on the bed
      and will refuse to print.
    fixes:
    - domain: process
      text: Try another orientation from the list — lying flat or diagonal often fits where upright doesn't.
    - domain: geometry
      text: Split the part into pieces that fit and join them with pins, dovetails or screws; put the cut where
        it is flat and not under load.
    - domain: process
      text: Scale it down if the exact size doesn't matter, or print it on a printer with a bigger build volume.
    tags:
    - size
    - build volume
    sources:
    - OrcaSlicer Wiki — Cutting tool — https://github.com/OrcaSlicer/OrcaSlicer/wiki/prepare_cutting_tool
  turned_to_fit:
    title: Turned on the bed to fit
    why: The part only fits on the bed when turned around the vertical axis, so the tool turned it. The 3MF file already
      has this rotation.
    fixes:
    - domain: process
      text: Keep the rotation when you open the 3MF; don't use "auto arrange" if it turns the part back.
    tags:
    - size
    - build volume
  support_marks:
    title: Rough surface where supports come off
    why: This overhang rests directly on support material. The printed surface will be rough and droopy because breakaway
      supports require an air gap.
    fixes:
    - domain: geometry
      text: Reorient the part to eliminate the overhang, or add 45-degree chamfers and triangular support ribs beneath the ledge
        so it supports itself cleanly without any support material.
    - domain: slicer
      text: If using a multi-material system, set the support interface material to an incompatible plastic (such
        as PETG interface for PLA, or PLA interface for PETG) to get a smooth, near-perfect bottom surface.
      settings:
        enable_support: '1'
        support_type: tree(auto)
        support_interface_pattern: rectilinear
    - domain: slicer
      text: In OrcaSlicer, "Make overhangs printable" turns steep overhangs into 45° slopes while slicing, so many of
        them need no support at all (the underside changes shape a little).
      settings:
        make_overhang_printable: '1'
    - domain: process
      text: Use a deburring tool, scraper, or fine sandpaper to clean up rough contact pockmarks left by support
        removal.
    tags:
    - support
    - surface-quality
    - overhang
    - interface
    sources:
    - Prusa Knowledge Base — Support material — https://help.prusa3d.com/article/support-material_1698
    - Slant 3D — How to Avoid Supports in 3D Printing — https://www.youtube.com/watch?v=cPKB6xX6hBA
    - Slant 3D — Stop Using Slicer Supports | Design for 3D Printing — https://www.youtube.com/watch?v=_R2E8VwyNz0
    - OrcaSlicer wiki — Overhangs (Make overhangs printable) — https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_overhangs
  trapped_support:
    title: Support trapped where you can't remove it
    why: An internal cavity or narrow tunnel has no opening to reach inside. Support printed inside cannot be removed
      and stays trapped.
    fixes:
    - domain: geometry
      text: Redesign the cavity ceiling with self-supporting 45-degree chamfers, arched domes, or teardrop profiles
        so the internal void prints cleanly across empty air without support structures.
    - domain: geometry
      text: Split the model into two pieces across the hollow chamber so the inside faces point upward during printing,
        then join them with alignment pins or glue.
    - domain: slicer
      text: Turn off supports or place support blocker volumes inside the cavity so the slicer does not generate
        unreachable internal support towers.
    tags:
    - support
    - internal-cavity
    - trapped-support
    - split-part
    sources:
    - Slant 3D — How to Avoid Supports in 3D Printing — https://www.youtube.com/watch?v=cPKB6xX6hBA
    - Slant 3D — 9 Design Rules for 3D Printing — https://www.youtube.com/watch?v=AD6L13tB1bE
    - Prusa Knowledge Base — Support material — https://help.prusa3d.com/article/support-material_1698
  bridge_sag:
    title: Top of a sideways hole sags
    why: A horizontal hole or slot has an unsupported ceiling spanning 4 to 8 mm. The top sags 0.2 to 1 mm into the
      opening as it bridges in mid-air.
    fixes:
    - domain: geometry
      text: Redesign the top of horizontal holes with a 90-degree or 120-degree teardrop peak, or add a flat-top
        bridge roof raised 0.3 mm above the target size so bridge droop stays outside the fastener clearance.
    - domain: slicer
      text: Slow down bridge printing speed to let the cooling fan freeze molten strands instantly before gravity
        pulls them downward.
      settings:
        bridge_speed: '25'
    - domain: process
      text: Run a twist drill bit or round needle file through the horizontal hole after printing to clear out sagged
        ceiling strands.
    tags:
    - bridge
    - horizontal-holes
    - teardrop
    - sagging
    sources:
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  hole_starts_midair:
    title: Hole starts in mid-air
    why: A hole opens directly above a wider cavity with no support below it. The first layer droops into the open space
      and prints ragged.
    fixes:
    - domain: geometry
      text: Add a sacrificial layer — one layer that closes the small hole where it starts. The layer below then bridges
        cleanly across the opening; poke or drill the thin skin open after printing. (The design panel can add it.)
    - domain: geometry
      text: Or turn the part over so the wider pocket faces up; then the hole starts on solid plastic.
    - domain: slicer
      text: Enable support from the build plate only, so the ring gets support from below inside the open space.
      settings:
        enable_support: '1'
        support_on_build_plate_only: '1'
    tags:
    - bridge
    - counterbore
    - sacrificial-layer
    sources:
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
    - Prusa Knowledge Base — Support material — https://help.prusa3d.com/article/support-material_1698
  sideways_hole_oval:
    title: Sideways hole prints oval
    why: A round hole lies horizontally on its side. The top strands sag 0.2 to 0.4 mm into the opening, leaving the
      hole oval and shorter from top to bottom.
    fixes:
    - domain: geometry
      text: Give the hole a teardrop top (a 45° point instead of the round ceiling), or make it 0.3–0.4 mm taller
        than the target size. The design panel can add the teardrop for you.
    - domain: slicer
      text: Slow down bridges and run the part fan at full speed over bridges so the ceiling strands set before they
        sag.
      settings:
        bridge_speed: '25'
    - domain: process
      text: Print the part so the hole points up (if the rest of the part allows), or clean out the hole with a matching
        drill bit after printing.
    tags:
    - holes
    - horizontal-holes
    - bridge
    - teardrop
    sources:
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
  shrinkage_size_error:
    title: Long part comes out short
    why: This part has a long continuous span across the bed. As the plastic cools it shrinks by 0.3% to over 0.8%,
      which can make a 200 mm span up to 1.6 mm shorter.
    fixes:
    - domain: slicer
      text: Set the filament's shrinkage compensation in the slicer (OrcaSlicer, Filament settings, Shrinkage) to the
        value measured on a calibration print, or scale the part up by the shrinkage percentage.
    - domain: geometry
      text: Leave clearance at long mating edges, or add the expected shrinkage to the critical dimensions in CAD.
    - domain: process
      text: Print a test bar of the same material, measure it and use that shrinkage; it varies by brand and colour.
    tags:
    - shrinkage
    - tolerances
    - dimensions
    sources:
    - Prusa Knowledge Base — dimensional accuracy and shrinkage articles (help.prusa3d.com)
    - Polymaker PolyLite ABS / ASA technical data sheets (shrinkage values)
  grip_texture:
    title: Grip texture
    why: This outer wall is smooth. Applying fuzzy skin in the slicer adds a rough texture to outer surfaces to improve
      grip and hide layer lines.
    fixes:
    - domain: slicer
      text: Turn on fuzzy skin for the outer walls (contour), about 0.3 mm thick, 0.8 mm point distance. In OrcaSlicer
        use the "combined" generator with Arachne walls, it keeps the wall closed; painted-only fuzzy skin puts it on
        just the gripped faces. The jiggling walls print slower (up to about half speed on those walls).
    - domain: geometry
      text: Or model the texture - small ridges, grooves or diamond grip patterns about 0.3-0.6 mm deep, with a 0.5-1 mm smooth border
        around holes and mating faces - so it prints at full speed and is the same in every slicer.
    tags:
    - surface
    - grip
    sources:
    - OrcaSlicer wiki, Fuzzy skin — https://github.com/OrcaSlicer/OrcaSlicer/wiki/others_settings_fuzzy_skin
    - Slant 3D — 10 Ways to Hide Layer Lines, Design 3D Printed Textures — https://www.youtube.com/watch?v=pUabxkiJAdE
  floor_shrink_line:
    title: Floor pulls outer line
    why: A solid internal floor meets a thinner outer wall. As the floor cools, it shrinks and pulls the outer wall
      inward to form a visible ridge.
    fixes:
    - domain: geometry
      text: Cut a relief groove about 1 mm wide and 1-2 mm deep round the floor's edge where it meets the wall, or
        taper the floor into the wall at 45 degrees, so its shrinking doesn't reach the outer skin. Or keep floor
        and walls about the same thickness.
    - domain: slicer
      text: Use gyroid infill rather than grid or solid in the floor, turn on precise outer wall, and don't let the
        slicer slow the outer wall down for cooling (so it cools the same as the rest).
      settings:
        sparse_infill_pattern: gyroid
        precise_outer_wall: '1'
    tags:
    - surface
    - shrinkage
    sources:
    - Slant 3D — How to Eliminate Shrink Lines — https://www.youtube.com/watch?v=d61u_lKFa-U
  rib_sink_line:
    title: Rib leaves sink line
    why: An internal rib meets an outer wall. Extra plastic at the joint shrinks as it cools, pulling the wall inward
      and leaving a vertical sink line on the outside.
    fixes:
    - domain: geometry
      text: Make the rib at most about 60 % as thick as the wall, or leave a 0.1-0.15 mm gap between the rib and the
        outer wall so the wall prints as one clean loop (the rib still touches it).
    - domain: slicer
      text: Print the outer wall first and a little slower, so it is set before the joint shrinks; one more wall line
        also hides the line.
      settings:
        wall_sequence: outer wall/inner wall
    tags:
    - surface
    - shrinkage
    sources:
    - Slant 3D — Ribs and Trusses are Made Wrong in 3D Printing — https://www.youtube.com/watch?v=OcxfQeeKn-s
  flat_gap_fuses:
    title: Flat gap in a moving joint fuses
    why: Two surfaces are separated by a flat horizontal gap only a few tenths of a millimeter tall. The upper surface
      sags as it prints in mid-air and fuses onto the plastic below.
    fixes:
    - domain: geometry
      text: Shape the pin and knuckle as opposing 45 degree cones with a 0.2-0.3 mm gap, so every face prints as a
        self-supporting slope; or make a short flat gap 0.4-0.6 mm (chain links).
    - domain: slicer
      text: Thinner layers and more bridge cooling make the sag smaller, but a flat gap under about 0.4 mm still fuses.
    tags:
    - print in place
    - clearance
    sources:
    - Maker's Muse — How to design print-in-place hinges — https://www.youtube.com/watch?v=fbSQvJJjw2Q
  gap_fuses:
    title: Gap between moving parts fuses shut
    why: Two separate surfaces are closer than 0.2 mm apart. Molten plastic bulges outward under extrusion pressure
      and bridges the gap, welding the surfaces together.
    fixes:
    - domain: geometry
      text: Increase the clearance gap in CAD to at least 0.3 to 0.4 mm between moving faces, and angle facing surfaces
        at 45 degrees so adjacent layers never bridge directly across from each other.
    - domain: slicer
      text: Switch to the Arachne wall generator to dynamically taper extrusion lines in tight spaces, and apply
        slight positive hole compensation to pull back boundaries.
      settings:
        wall_generator: arachne
        xy_hole_compensation: '0.05'
    - domain: process
      text: Gently work the joint back and forth with pliers right after cooling to crack any tiny plastic strings
        bridging across the gap.
    tags:
    - print-in-place
    - clearance
    - tolerances
    - hinges
    sources:
    - Maker's Muse — Clearance and Tolerance 3D Printing Gauge — https://www.youtube.com/watch?v=TYuLVN3YHw8
    - Maker's Muse — How to Design Print-in-Place Hinges — https://www.youtube.com/watch?v=fbSQvJJjw2Q
    - Rahix / Slant 3D — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
  hole_closes:
    title: Tiny hole closes up
    why: This vertical hole is smaller than 1.5 mm in diameter. Surface tension drags hot plastic inward around tight
      circles, choking the opening or closing it completely.
    fixes:
    - domain: geometry
      text: Enlarge small holes in CAD to at least 2.0 mm diameter, or model them as a many-sided polygon (hexagon or octagon)
        so the slicer prints short straight segments instead of pulling loops inward.
    - domain: slicer
      text: Enable the Arachne wall generator to dynamically thin extrusion lines around tiny walls, and
        apply positive hole compensation.
      settings:
        wall_generator: arachne
        xy_hole_compensation: '0.15'
    - domain: process
      text: Clean out the closed hole after printing using a small twist drill bit in a small hand drill.
    - domain: process
      text: Swap to a smaller 0.2 mm nozzle assembly that can trace tiny inner walls without crowding into
        the center of the bore.
    tags:
    - holes
    - small-features
    - polyholes
    - nozzle-size
    sources:
    - '"Nophead (Chris Palmer) — Hydraraptor: Polyholes — https://hydraraptor.blogspot.com/2011/02/polyholes.'
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
  small_hole_undersized:
    title: Small hole prints too small
    why: This vertical hole is 6 mm or smaller in diameter. Plastic is pulled inward around tight curves, making the
      printed hole 0.15 to 0.3 mm too small.
    fixes:
    - domain: geometry
      text: Oversize vertical fastener holes in CAD by +0.2 to +0.3 mm (for example, design M3 clearance holes at
        3.3 to 3.4 mm), or model the hole as a many-sided polygon (hexagon or octagon) so the slicer prints straight segments.
    - domain: slicer
      text: Apply positive X-Y hole compensation in your slicer to automatically offset inner hole walls outward.
      settings:
        xy_hole_compensation: '0.15'
    - domain: process
      text: Clean out undersized holes with a drill bit sized for your fastener or a small round file for a precise
        sliding fit.
    tags:
    - holes
    - tolerances
    - shrinkage
    - fasteners
    sources:
    - 'Nophead (Chris Palmer) — Hydraraptor: Polyholes — https://hydraraptor.blogspot.com/2011/02/polyholes.html'
    - Maker's Muse — 7 Ways to Design Holes for 3D Printing — https://www.youtube.com/watch?v=j6508J94VsA
    - OrcaSlicer Wiki — Precise wall — https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_precision
  nut_trap_tight:
    title: Nut pocket too tight for the nut
    why: This hexagonal pocket is the nut's exact size, and printed pockets come out a little small, so the nut won't
      go in or cracks the walls. It needs about 0.2-0.3 mm more across the flats than the nut.
    fixes:
    - domain: geometry
      text: Make the hexagon 0.2–0.3 mm bigger across the flats than the nut (M3 5.7–5.8 mm, M4 7.2–7.3 mm), and the
        pocket a little deeper than the nut is thick.
    - domain: slicer
      text: Positive X-Y hole compensation opens all holes, nut traps included, a little.
      settings:
        xy_hole_compensation: '0.15'
    - domain: process
      text: Pull the nut in with a screw from the other side, or press it in with a soldering iron set low.
    tags:
    - holes
    - tolerances
    - fasteners
    sources:
    - OpenFlexure — nut trap sizes from ISO 4032 — https://gitlab.com/openflexure/openflexure-microscope/-/merge_requests/371
    - fb-library — Bolt fittings — https://fb-library.readthedocs.io/en/latest/bolt_fittings/
  insert_wall_thin:
    title: Wall around a heat-set insert too thin
    why: The wall around this hole is less than 1.6 mm thick. Pressing in a hot insert pushes plastic outward, causing
      the wall to bulge or split.
    fixes:
    - domain: geometry
      text: Give the hole about 2 mm of wall all round (a thicker collar, or raised ring, around twice the insert's diameter), and make it about
        1 mm deeper than the insert is long.
    - domain: slicer
      text: Print more walls so the plastic around the insert is solid, not infill.
      settings:
        wall_loops: '4'
    - domain: process
      text: Press the insert in slowly at the temperature the insert maker gives, so it melts its way in instead of
        pushing the wall apart.
    tags:
    - holes
    - fasteners
    - strength
    sources:
    - CNC Kitchen — Tips & Tricks for Heat-Set Inserts — https://cnckitchen.com/blog/tips-and-tricks-for-heat-set-inserts
    - DigiKey Maker.io — How to use heat-set inserts — https://www.digikey.com/es/maker/tutorials/2025/intro-to-freecad-part-4-how-to-use-heat-set-inserts
    - Sovol — Design strong screw bosses for heat-set inserts — https://www.sovol3d.com/blogs/news/3d-printing-with-heat-set-inserts-design-strong-screw-bosses-that-last
  screw_wall_thin:
    title: Thin wall around a screw hole
    why: The wall around this screw hole is thinner than the screw diameter. Driving the screw in pushes plastic outward,
      splitting the wall along the layers or stripping the thread.
    fixes:
    - domain: geometry
      text: Give the hole a thicker collar (raised ring) with at least the screw's diameter of plastic all round (M3 needs about 3 mm),
        or move the hole further from the edge.
    - domain: slicer
      text: Print more walls so the screw cuts into solid plastic, not infill.
      settings:
        wall_loops: '4'
    - domain: process
      text: Use a heat-set insert or a nut instead; they spread the load and can be screwed in and out many times.
    tags:
    - fastener
    - screw
    - hole
    sources:
    - Hubs — How to assemble 3D printed parts with threaded fasteners (wall around a thread ≥ the fastener's diameter)
      — https://www.hubs.com/knowledge-base/how-assemble-3d-printed-parts-threaded-fasteners/
  first_layer_detail:
    title: Fine detail squashed on the bed
    why: Fine details or shallow grooves sit on the bottom face against the build plate. First-layer bed squish presses
      the plastic outward, blurring the shapes and squashing narrow grooves shut.
    fixes:
    - domain: geometry
      text: Recess (engrave) text into the bottom face by at least 0.4 to 0.6 mm using wide, bold sans-serif fonts with stroke
        widths of at least 0.8 mm, or move fine logos onto top or vertical side faces.
    - domain: slicer
      text: Increase elephant foot compensation in your slicer to pull the first-layer outer wall inward and keep
        recessed lines open.
      settings:
        elefant_foot_compensation: '0.20'
    - domain: process
      text: Calibrate first-layer Z-offset and lower bed temperature by 5 degrees after the first layer so bottom
        plastic does not soften and bulge under the weight of upper layers.
    tags:
    - elephant-foot
    - text
    - first-layer
    - fine-detail
    sources:
    - Prusa Knowledge Base — Elephant foot compensation — https://help.prusa3d.com/article/elephant-foot-compensation_114487
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
    - Slant 3D — How to Design Parts for 3D Printing (Fillets & Chamfers) — https://www.youtube.com/watch?v=9JqN2aFBa2w
  fine_detail_rough:
    title: Raised detail too fine for the nozzle
    why: Raised features or ribs are narrower than 1.5 times the nozzle width. A standard nozzle cannot trace both walls
      of features this thin, leaving them rough, jagged, or missing entirely.
    fixes:
    - domain: geometry
      text: Thicken positive features and text stroke widths in CAD to at least 0.6 to 0.8 mm, and choose bold sans-serif
        typefaces without fine tapered tips.
    - domain: slicer
      text: Turn on the Arachne wall generator to dynamically taper extrusion lines down to fine tips, and lower
        layer height to sharpen vertical resolution.
      settings:
        wall_generator: arachne
        layer_height: '0.12'
    - domain: process
      text: Swap to a smaller 0.2 mm nozzle assembly on your printer to lay down narrower extrusion tracks and capture
        miniature features cleanly.
    tags:
    - fine-detail
    - text
    - arachne
    - nozzle-size
    sources:
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
    - Slant 3D — How to Design Text for 3D Printing — https://www.youtube.com/watch?v=uvL8Bdf0Hac
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  warping:
    title: Base corners can lift
    why: This part has a long flat base with sharp corners. As the plastic cools, it shrinks along the base and pulls
      the corners off the build plate.
    fixes:
    - domain: geometry
      text: Round sharp exterior base corners with large fillets (3 mm radius or larger), or add circular mouse ears
        at the corners in CAD to disperse lifting tension.
    - domain: slicer
      text: Add mouse ears or a wide outer brim to clamp down the corners, and choose Gyroid infill at moderate
        density to balance internal shrinkage forces in all directions.
      settings:
        brim_type: brim_ears
        brim_width: '8'
        sparse_infill_pattern: gyroid
        sparse_infill_density: 15%
    - domain: process
      text: Enclose the printer to keep ambient air warm, preheat the bed for 10 minutes before printing, and wash
        the build sheet with warm water and dish soap to ensure maximum adhesion.
    tags:
    - warping
    - bed-adhesion
    - brim
    - mouse-ears
    sources:
    - CNC Kitchen — How to Prevent Warping in 3D Printing — https://www.youtube.com/watch?v=HNAtHl6kB7Y
    - 'OrcaSlicer Wiki — Others Settings: Brim type (Mouse ear) — https://github.com/OrcaSlicer/OrcaSlicer/wiki/others_settings_brim'
    - Bambu Lab Wiki — ASA CF / PAHT CF Usage Guide — https://wiki.bambulab.com/en/filament/asacf_pahtcf
  bed_adhesion:
    title: May come loose here
    why: As the print cools and shrinks, this spot may pull free of the build plate. The check estimates how well
      the material sticks to the plate.
    fixes:
    - domain: slicer
      text: Add mouse ears to anchor the lifting corner, or use a wide outer brim.
      settings:
        brim_type: brim_ears
        brim_width: '8'
    - domain: process
      text: Try a warmer bed within the filament maker's range. Clean the plate and use a surface suitable for this
        filament. Use glue only if the plate maker recommends it for the combination.
    - domain: process
      text: Keep drafts away. Close the enclosure when printing ABS, ASA or PC.
    tags:
    - warping
    - bed adhesion
    sources:
    - Prusa Knowledge Base — Warping — https://help.prusa3d.com/article/warping_2011
    - Prusa Knowledge Base — Steel sheets — https://help.prusa3d.com/article/steel-sheets_2195
  weak_upright_pin:
    title: Upright pin snaps along its layers
    why: A narrow pin stands upright on the print bed. Horizontal layer lines run across the stem, so a sideways bump
      easily snaps it off.
    fixes:
    - domain: geometry
      text: Reorient the part to print the pin lying flat on the build plate so continuous wall lines run
        lengthwise, add a generous fillet at the pin root, or design an internal bore to press in a steel dowel
        pin or screw.
    - domain: slicer
      text: Add more walls so the pin prints entirely as solid walls, and lower layer height
        to pack more bonded surface area into the column.
      settings:
        wall_loops: '6'
        layer_height: '0.12'
    - domain: process
      text: Print at the upper end of your filament's recommended nozzle temperature and reduce cooling fan speed
        so the layers fuse better.
    tags:
    - strength
    - orientation
    - pins
    - layer-adhesion
    sources:
    - CNC Kitchen — The Influence of Extrusion Temperature on Layer Adhesion — https://www.cnckitchen.com/blog/the-influence-of-extrusion-temperature-on-layer-adhesion
    - Slant 3D — Design Unbreakable Pins with Perfect Tolerances — https://www.youtube.com/watch?v=uMA-Wt-z_BU
    - Slant 3D — Make a Pin that Doesn't Break. Use Ripples — https://www.youtube.com/shorts/njTfpxL71zk
  living_hinge:
    title: Thin hinge that bends
    why: A thin hinge connects two thicker sections. Printed standing up, layer lines run along the fold and can break
      on the very first bend.
    fixes:
    - domain: geometry
      text: Keep the hinge 0.4–0.6 mm thick (two or three layers) and a few millimetres long, with rounded edges where
        it meets the thicker parts so the bend spreads out.
    - domain: slicer
      text: Print the hinge solid with lines across the fold, and slower, so the few layers bond well.
      settings:
        sparse_infill_density: 100%
        bottom_shell_layers: '3'
    - domain: process
      text: Print the hinge in PETG or TPU (or PP if your printer handles it), lying flat. Bend it once while it is
        still warm from the bed. For a hinge that must last, use a pin hinge instead.
    tags:
    - strength
    - hinge
    sources:
    - Balderrama-Armendariz et al., folding endurance of FDM living hinges (PLA ~136–211 cycles, PP and TPU far more),
      SFF Symposium 2016 — https://utw10945.utweb.utexas.edu/sites/default/files/2016/188-Balderrama-Armendariz.pdf
    - FacFox — How to design living hinges for 3D printed parts (0.4–0.6 mm, at least two layers, flat on the bed)
      — https://facfox.com/docs/kb/how-to-design-living-hinges-for-3d-printed-parts
  snap_fit_upright:
    title: Snap-fit tab bends across its layers
    why: A thin snap-fit tab stands upright. Bending across horizontal layer lines is weak, so the tab can snap off
      the first time it is pushed.
    fixes:
    - domain: geometry
      text: Make the tab longer or thinner, or the hook shallower, so it bends less; round the corner where the tab
        meets the part.
    - domain: slicer
      text: Print the tab with only walls, no infill, so it bends along whole lines.
      settings:
        wall_loops: '4'
    - domain: process
      text: Turn the part so the tab lies flat or on its side; then it bends along the lines. PETG bends further
        than PLA before it breaks.
    tags:
    - strength
    - snap-fit
    sources:
    - Bayer MaterialScience — Snap-Fit Joints for Plastics (ε = 1.5 · t · y / L², ~70 % of yield strain for amorphous
      plastics, PC 4 %) — http://fab.cba.mit.edu/classes/S62.12/people/vernelle.noel/Plastic_Snap_fit_design.pdf
    - Core77 / Fictiv — How to Design Snap Fit Components (reduce allowable strain by 50 % for Z-axis cantilevers)
      — https://www.core77.com/posts/65318/how-to-design-snap-fit-components
    - Loftsmith — Snap Fit Design for 3D Printing (PLA ~2 %, PETG 3–4 %, halve across layers)
      — https://loftsmith.com/guides/snap-fit-3d-printing
  large_deflection:
    title: This part bends a lot
    why: As a flexible part bends, the load acts on a different shape and can bend it a different amount.
    fixes:
    - domain: geometry
      text: If the bend is unwanted, shorten the unsupported span or add a brace.
    - domain: process
      text: Test a printed copy at the intended load and check that it still has room to move.
    tags: [strength, snap-fit]
    sources:
    - Bisshopp and Drucker, Large Deflection of Cantilever Beams (1945) — https://doi.org/10.1090/qam/13360
  compression_buckling:
    title: Thin walls can bow under load
    why: A long, thin wall can suddenly bow sideways under compression before the plastic itself breaks.
    fixes:
    - domain: geometry
      text: Add a rib or shorten the unsupported length so the wall has less room to bow.
    - domain: process
      text: Support the wall from the side or reduce the force pushing along it.
    tags: [strength, buckling]
    sources:
    - MIT OpenCourseWare, Structural Mechanics, Lecture 7, Buckling of Beams — https://ocw.mit.edu/courses/2-080j-structural-mechanics-fall-2013/resources/mit2_080jf13_lecture7/
  thick_solid_block:
    title: Thick solid block
    why: This section is a thick solid block. The slicer fills the inside with hollow infill, so adding more infill
      wastes time and plastic with little extra strength.
    fixes:
    - domain: geometry
      text: If it has to be stiff, make it a shell with ribs (2–3 mm walls, a rib every 10–20 mm). That is stiffer
        per gram than infill. Otherwise leave it as it is.
    - domain: slicer
      text: Add walls before you add infill; keep the infill low.
      settings:
        wall_loops: '4'
        sparse_infill_density: 15%
    - domain: process
      text: Thick blocks of ABS or ASA warp more as they cool; an enclosure helps.
    tags:
    - strength
    - material-use
    sources:
    - HackSpace — Experiments with strong 3D prints (perimeters add more strength than infill)
      — https://hackspace.raspberrypi.com/articles/experiments-with-strong-3d-prints
  thin_neck:
    title: Thin neck takes the whole load
    why: A narrow neck connects two thicker sections. Pulling or twisting forces concentrate there, making it snap easily
      across the small layer bonds.
    fixes:
    - domain: geometry
      text: Thicken the narrow neck in CAD, add triangular support ribs, and use large transitional fillets (3 mm
        radius or larger) to blend the neck smoothly into the larger sections and eliminate sharp stress-raising
        notches.
    - domain: slicer
      text: Add more walls so the entire narrow neck is filled with solid walls rather than sparse
        internal infill.
      settings:
        wall_loops: '6'
        sparse_infill_pattern: gyroid
        sparse_infill_density: 30%
    - domain: process
      text: Reorient the part on the bed so primary pulling and bending forces run along continuous extruded strands
        rather than pulling across layer lines.
    tags:
    - strength
    - stress-concentration
    - fillets
    - perimeters
    sources:
    - CNC Kitchen — How designs the strongest hook? (more walls beat more infill) — https://cnckitchen.com/blog/how-designs-the-strongest-hook-polymaker-competition
    - Rahix — Design for 3D-Printing — https://blog.rahix.de/design-for-3d-printing/
    - CNC Kitchen — The Influence of Extrusion Temperature on Layer Adhesion — https://www.cnckitchen.com/blog/the-influence-of-extrusion-temperature-on-layer-adhesion
  single_line_wall:
    title: Wall is only one line thick
    why: This wall is thinner than two nozzle passes, under 0.8 mm on a 0.4 mm nozzle. The slicer prints only a single
      bead of plastic, leaving the wall weak, full of pinholes, and easy to crack.
    fixes:
    - domain: geometry
      text: Thicken the wall in CAD to at least 1.2 mm (or at least 0.85 mm for a 0.4 mm nozzle) so the slicer fits
        inner and outer walls with solid overlap.
    - domain: slicer
      text: Turn on the Arachne wall generator to dynamically widen extrusion paths and eliminate hollow gaps in
        thin sections.
      settings:
        wall_generator: arachne
        wall_loops: '3'
    - domain: process
      text: If thin walls are required by your design, install a smaller 0.2 mm nozzle assembly so multiple wall
        lines can fit inside the narrow wall thickness.
    tags:
    - thin-wall
    - perimeters
    - strength
    - arachne
    sources:
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
    - CNC Kitchen — How designs the strongest hook? (more walls beat more infill) — https://cnckitchen.com/blog/how-designs-the-strongest-hook-polymaker-competition
  setup_layer_too_thick:
    title: Layers too thick for the nozzle
    why: Layer height is set thicker than three quarters of the nozzle width. The lines do not get squeezed together
      enough, so the part easily splits between layers.
    fixes:
    - domain: slicer
      text: Lower the layer height to at most 0.75 × the nozzle diameter (0.3 mm on a 0.4 mm nozzle), and keep
        the line width at least 1.5 × the layer height.
    - domain: process
      text: For thick layers and fast prints, fit a bigger nozzle (0.6 mm takes up to 0.45 mm layers).
    tags:
    - setup
    sources:
    - CNC Kitchen — The influence of layer height on the strength of FDM prints — https://www.cnckitchen.com/blog/the-influence-of-layer-height-on-the-strength-of-fdm-3d-prints
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  setup_support_gap_zero:
    title: Support touches the part
    why: Support is set to touch the part without any gap. The support fuses directly to the printed surface and tears
      off pieces of the part when removed.
    fixes:
    - domain: slicer
      text: Set the support top Z distance to 0.15-0.2 mm (PETG 0.2-0.25 mm), or about one layer.
      settings:
        support_top_z_distance: '0.2'
    - domain: process
      text: With a second filament that doesn't bond (a support material) the gap can be 0.
    tags:
    - setup
    - support
    sources:
    - Prusa Knowledge Base — Support material (top contact Z distance) — https://help.prusa3d.com/article/support-material_1698
  setup_flow_too_high:
    title: Faster than the hotend can melt
    why: The print speed requires more melted plastic per second than the hotend can supply. The extruder skips, causing
      thin lines and weak layer bonds.
    fixes:
    - domain: slicer
      text: Set the filament's max volumetric speed to what your hotend really melts (standard hotends about
        11-22 mm³/s for PLA, less for PETG and much less for TPU), and let the slicer limit the speeds by it.
    - domain: process
      text: Print the max flow test of your slicer once per filament to measure it.
    tags:
    - setup
    - speed
    sources:
    - Prusa Knowledge Base — Max volumetric speed — https://help.prusa3d.com/article/max-volumetric-speed_127176
  setup_plate_too_sticky:
    title: Filament sticks too hard to this plate
    why: PETG, TPU, or PC filament is printing on smooth PEI or bare glass. The plastic bonds so strongly that removing
      the part can rip pieces out of the plate.
    fixes:
    - domain: process
      text: Put a thin layer of glue stick on the plate as a release layer, or print on a textured PEI plate
        (the part comes off once it has cooled below about 40 °C).
    - domain: slicer
      text: A slightly larger first-layer gap (Z offset) presses the first layer on less hard.
    tags:
    - setup
    - adhesion
    sources:
    - Prusa Knowledge Base — PETG — https://help.prusa3d.com/article/petg_2059
  vase_mode_possible:
    title: Could print in vase mode
    why: 'This shape has an open top, so it can print in spiral vase mode: one continuous wall with no seam, much faster.
      That wall is only one line thick, so it is weaker and can leak.'
    fixes:
    - domain: slicer
      text: Turn on "Spiral vase" (OrcaSlicer and Bambu Studio - Others, Special mode; PrusaSlicer - Print settings,
        Layers and perimeters). For a stronger wall use a wider line (up to about twice the nozzle) or a bigger nozzle.
    - domain: process
      text: Keep normal printing if it has to hold water under pressure or take a knock; vase walls are one line.
    tags:
    - speed
    - surface
    sources:
    - OrcaSlicer Wiki — Special mode, spiral vase — https://github.com/OrcaSlicer/OrcaSlicer/wiki/others_settings_special_mode
  coarse_facets:
    title: Curves exported too coarse
    why: Curved surfaces are exported with low mesh quality (too few triangles). The printer prints visible flat edges, making round features
      come out the wrong size.
    fixes:
    - domain: process
      text: Export the STL again with higher mesh quality (more triangles, e.g. 0.01 mm
        or "high" quality), or load the STEP file instead - this app reads it with its exact curves.
    - domain: slicer
      text: Nothing in the slicer brings the curve back; the slicer's arc fitting only smooths the moves, not
        the shape. Hole compensation can make a coarse hole a bit bigger, but not round.
    tags:
    - shape
    - file
    sources:
    - OrcaSlicer Wiki — Quality settings, precision (arc fitting, resolution, STEP import) — https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_precision
  shallow_slope_stairs:
    title: Shallow slope prints as steps
    why: This surface has a shallow slope of 5 to 20 degrees from flat. The sliced layer edges are wide, leaving visible
      stair-steps instead of a smooth slope.
    fixes:
    - domain: slicer
      text: Use thinner layers only over the slope's height (a height range modifier, or variable layer height
        in the slicer). The 3MF from this app can carry that range. Keep "ensure vertical shell thickness" on
        so the thinner top doesn't show the infill.
      settings:
        ensure_vertical_shell_thickness: '1'
    - domain: geometry
      text: Make the slope steeper (a 45 degree chamfer instead of a shallow fillet), or turn the part so the
        face stands up and the nozzle traces the curve.
    tags:
    - surface
    - layer height
    sources:
    - Prusa Knowledge Base — Variable layer height function — https://help.prusa3d.com/article/variable-layer-height-function_1750
    - Prusa Knowledge Base — Layers and perimeters (ensure vertical shell thickness on shallow slopes) — https://help.prusa3d.com/article/layers-and-perimeters_1748
  pause_to_insert:
    title: Closed pocket needs pause
    why: An internal pocket is closed inside the part. The print must pause before the roof closes, or support material
      fills the pocket and a flat roof can sag.
    fixes:
    - domain: process
      text: Pause before the layer the check names (OrcaSlicer, PrusaSlicer, Bambu Studio - right-click that layer in
        the preview and add a pause), drop the part in, check it sits below the top of the pocket, and resume. A
        drop of glue keeps a magnet from jumping to the nozzle. Bambu Studio ignores the pause in our 3MF, so slice it
        there, then add the pause to the sliced file (Download, "Add the pause to a file sliced in Bambu Studio").
    - domain: slicer
      text: Put supports on the build plate only, so none are printed inside the pocket.
      settings:
        support_on_build_plate_only: '1'
    - domain: geometry
      text: Make the pocket 0.2-0.3 mm bigger than the part on every side and about one layer deeper, so it drops in
        without force and nothing sticks up into the nozzle's path.
    - domain: geometry
      text: No pause at all - open the pocket to the side with a slot the part slides into after printing, with two
        small bumps (about 0.3 mm) at the pocket's mouth that it clicks past (Design changes offers it). Or a pocket
        open at the top with a thin snap lip or grip fins.
    tags:
    - process
    - pause
    sources:
    - Slant 3D — Stop Gluing Magnets Into Your 3D Prints — https://www.youtube.com/watch?v=46zH3BI8-LQ
    - Prusa Knowledge Base — Insert pause or custom G-code at layer (magnets put in at a pause) — https://help.prusa3d.com/article/insert-pause-or-custom-g-code-at-layer_120490
  modelled_thread:
    title: Thread modelled into the part
    why: A 60° thread is built from stacked layers. The layer steps make the surface rough and prone to binding or stripping
      unless extra clearance is provided.
    fixes:
    - domain: slicer
      text: Print the threaded part with finer layers (at most a quarter of the thread spacing (pitch), e.g. 0.12 mm for M8), using
        variable layer height over the thread only.
      settings:
        layer_height: '0.12'
    - domain: process
      text: Screw the bolt in and out a few times to clean the thread. For threads smaller than M5, tap a plain hole,
        or use a heat-set insert or a nut instead.
    - domain: geometry
      text: Stand the thread up, and model about 0.3 mm of clearance between a printed bolt and nut. For small
        threads, model a plain hole for a tap or insert instead.
    tags:
    - holes
    - fasteners
    sources:
    - Hubs — How to assemble 3D printed parts with threaded fasteners (avoid printed threads below M5; clean the thread) — https://www.hubs.com/knowledge-base/how-assemble-3d-printed-parts-threaded-fasteners/
    - Prusa Knowledge Base — Modeling with 3D printing in mind (at least 0.3 mm for moving parts) — https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
  fibre_filled:
    title: Fibre filament breaks suddenly
    why: Short fibres in this filament align along the printed lines and never cross between layers. The part bends
      and warps less, but the layer bonds are weaker and break more suddenly.
    fixes:
    - domain: process
      text: For a part that must not break, print the plain plastic (or a tougher one such as PETG, ASA or PC) and add
        walls. Use a fibre filament when the part should bend less or stay flat, not when it should hold more.
    - domain: process
      text: Fibre filament wears a brass nozzle quickly; use a hardened one (0.6 mm clogs less than 0.4 mm).
    - domain: slicer
      text: If you print it in a fibre filament anyway, print a little hotter and slower so the layers fuse better,
        and turn the part so the load runs along the layers.
    tags:
    - material
    - strength
    - stiffness
    sources:
    - Polymaker — PolyLite PLA-CF Technical Data Sheet — https://shop.polymaker.com/products/polylite-pla-cf
    - Polymaker — PolyLite PLA Technical Data Sheet — https://shop.polymaker.com/products/polylite-pla
    - Bambu Lab Wiki — ASA-CF / PAHT-CF guide — https://wiki.bambulab.com/en/filament/asacf_pahtcf
    - CNC Kitchen — Does carbon fiber make 3D prints stronger? — https://www.youtube.com/watch?v=64dd03814yU
  wall_line_mismatch:
    title: Wall width doesn't match whole print lines
    why: The wall falls between whole extrusion line widths, so the slicer leaves a narrow gap inside the wall or fills
      it with slow, messy zigzags that weaken the shell.
    fixes:
    - domain: geometry
      text: Make the wall a whole multiple of your extrusion line width (see the suggested thickness above) so every
        pass sits tightly side by side with no gap.
    - domain: slicer
      text: Turn on the Arachne wall generator so the slicer widens or narrows lines to fill the wall cleanly, or set
        the slicer's line width to the suggested value above so whole lines fill it.
      settings:
        wall_generator: arachne
    tags:
    - walls
    - line-width
    - arachne
    sources:
    - Prusa Knowledge Base — Arachne perimeter generator — https://help.prusa3d.com/article/arachne-perimeter-generator_352769
    - CNC Kitchen — The Effect of Extrusion Width on Strength and Quality of 3D Prints — https://www.cnckitchen.com/blog/the-effect-of-extrusion-width-on-strength-and-quality-of-3d-prints
  load_bearing_wall_thin:
    title: Wall thin for loads
    why: Walls under about 1.6 mm only fit two or three wall lines. They are fine for light covers, but flex and
      crack quickly under steady load, clamping, or impact.
    fixes:
    - domain: geometry
      text: Thicken load-bearing walls to at least 1.6 mm (about 4 wall lines on a 0.4 mm nozzle) or add ribs
        along the load path.
    - domain: slicer
      text: Add more walls so thin sections print completely solid instead of with sparse infill, and try slightly
        wider extrusion lines (up to 1.4x the nozzle) for better layer bonding.
      settings:
        wall_loops: '4'
    - domain: process
      text: Orient the part so pulling and bending loads run along the printed lines rather than pulling layers apart,
        or use a tougher filament such as PETG or ASA.
    tags:
    - walls
    - strength
    - perimeters
    sources:
    - Voron Design — Print Settings (4 walls x 0.4 mm = 1.6 mm structural shell) — https://docs.vorondesign.com/sourcing.html#print-settings
    - CNC Kitchen — The Effect of Extrusion Width on Strength and Quality of 3D Prints — https://www.cnckitchen.com/blog/the-effect-of-extrusion-width-on-strength-and-quality-of-3d-prints
    - Prusa Knowledge Base — Layers and perimeters — https://help.prusa3d.com/article/layers-and-perimeters_1748
  uneven_wall_thickness:
    title: Thick next to thin wall
    why: Thick solid sections hold heat longer and shrink more as they cool than thin walls right beside them. That
      uneven pull can leave sink marks along the transition or warp the thinner wall.
    fixes:
    - domain: geometry
      text: Keep wall thicknesses closer together by hollowing out thick blocks into a shell with ribs, and blend
        stepped transitions with gradual chamfers or fillets.
    - domain: slicer
      text: Keep infill low and uniform (around 15% gyroid) inside the thick section so it holds less heat and pulls
        less as it cools, and add an outer brim if the thin wall sits near the bed.
      settings:
        sparse_infill_density: 15%
        sparse_infill_pattern: gyroid
    - domain: process
      text: Slow down cooling drafts or use an enclosure (especially for ABS, ASA, or PETG) so thick and thin sections
        cool at a more even rate.
    tags:
    - walls
    - warping
    - cooling
    - sink
    sources:
    - Slant 3D — How to Eliminate Shrink Lines — https://www.youtube.com/watch?v=d61u_lKFa-U
    - Hubs — What are the key design elements for 3D printing? — https://www.hubs.com/knowledge-base/key-design-considerations-3d-printing/


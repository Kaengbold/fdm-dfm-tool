name: Deploy to GitHub Pages

# Publishes the static app: web/ plus the engine files it loads from core/fdmcore/.
# Needs Settings -> Pages -> Source: "GitHub Actions" (and a public repo or a paid plan).
on:
  push:
    branches: [main]
    paths:  # only what ends up on the site (a merge of docs or tests doesn't redeploy)
      - "web/**"
      - "core/fdmcore/**"
      - "tools/vendor.py"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/core
          cp -r web _site/web
          rsync -a --exclude '__pycache__' core/fdmcore/ _site/core/fdmcore/
          cp LICENSE _site/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=web/"><a href="web/">FDM DFM Tool</a>\n' > _site/index.html
      - uses: actions/cache@v4  # the pinned libraries only change with tools/vendor.py
        with:
          path: _vendor
          key: vendor-${{ hashFiles('tools/vendor.py') }}
      - name: Serve the libraries ourselves (no CDN at run time)
        # Pinned three.js, manifold, OpenCascade and Pyodide (+ the engine's packages) under _site/vendor;
        # the five files that load them switch their base URL to it. The AI panel's SDK stays on the CDN.
        run: |
          [ -d _vendor ] || python3 tools/vendor.py _vendor
          cp -r _vendor _site/vendor
          cd _site/web
          sed -i 's#https://cdn.jsdelivr.net#../vendor#g' index.html worker.js geometry.js step.js stepwrite.js
          # The CSP lists the CDN as a script source: not needed once it isn't used ('self' covers ../vendor).
          sed -i "s# ../vendor 'sha256# 'sha256#" index.html
          ! grep -n "cdn.jsdelivr.net" index.html worker.js geometry.js step.js stepwrite.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design tokens</title>
<!-- T-510: shows the tokens and the work layout in light and dark. Open via the dev server:
     http://localhost:8000/design/tokens.html (both themes side by side) or ?theme=light / ?theme=dark (one, full size). -->
<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="../web/ui/base.css">
<style>
  body { min-width: 0; min-height: 0; }
  .pair-mode #sheet { display: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .pair iframe { width: 100%; height: 100%; border: 0; border-right: 1px solid var(--line); }
  .sheet { padding: var(--s-6); display: grid; gap: var(--gap-sections); }
  .row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: end; }
  .sw { display: grid; gap: var(--s-1); font-size: var(--fs-xs); color: var(--text-2); }
  .sw i { display: block; width: 72px; height: 48px; border-radius: var(--r); border: 1px solid var(--line); }
  .space i { display: block; height: 16px; background: var(--accent); border-radius: var(--r-sm); }
  .mini { height: 360px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .mini .app { height: 100%; }
  .btn { min-height: var(--hit); padding: 0 var(--s-4); border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-raised); cursor: pointer; }
  .btn.primary { min-height: var(--hit-primary); background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); font-weight: var(--fw-bold); }
  .card { padding: var(--s-4); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: var(--s-1); }
  .card.on { border-color: var(--accent); background: var(--accent-soft); }
  .rail ol { list-style: none; padding: 0; display: grid; gap: var(--s-1); }
  .rail li { padding: var(--s-2) var(--s-3); border-radius: var(--r); color: var(--text-3); }
  .rail li.done { color: var(--text-2); }
  .rail li.now { background: var(--accent-soft); color: var(--accent-text); font-weight: var(--fw-bold); }
</style>
</head>
<body>
<script>
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme) document.documentElement.dataset.theme = theme;
  else document.documentElement.classList.add("pair-mode");
</script>
<main class="sheet" id="sheet">
  <h1>Tokens</h1>
  <section class="row" id="colours"></section>
  <section class="row">
    <span style="font-size: var(--fs-xs)">12</span><span style="font-size: var(--fs-sm)">13</span>
    <span style="font-size: var(--fs-md)">15 body</span><span style="font-size: var(--fs-lg)">16</span>
    <b style="font-size: var(--fs-xl)">20 step</b><b style="font-size: var(--fs-xxl)">28</b>
    <span class="num">1.234 mm</span>
  </section>
  <section class="row space" id="spaces"></section>
  <section class="row">
    <button class="btn">Back</button><button class="btn primary">Next</button>
    <div class="card on"><b>Balanced</b><span class="hint">Safety ×3</span></div>
    <div class="card"><b>Strong</b><span class="hint">Safety ×5</span></div>
  </section>
  <div class="mini">
    <div class="app">
      <header class="app-header"><b>FDM Check</b></header>
      <div class="app-screen" data-layout="work">
        <nav class="rail"><ol><li class="done">Part</li><li class="done">Setup</li><li class="now">Holds</li><li>Loads</li></ol></nav>
        <div class="stage"><span class="stage-pill card">Click where it's held</span></div>
        <aside class="panel">
          <div class="panel-head"><h2>Holds</h2><span class="hint">Where is the part fixed?</span></div>
          <div class="panel-body"><div class="card">Screw holes · 2</div></div>
          <div class="panel-foot"><button class="btn">Back</button><button class="btn primary">Next</button></div>
        </aside>
      </div>
    </div>
  </div>
</main>
<script>
  if (!theme) {
    document.body.insertAdjacentHTML("beforeend", '<div class="pair"><iframe src="?theme=light" title="Light"></iframe><iframe src="?theme=dark" title="Dark"></iframe></div>');
  } else {
    const css = getComputedStyle(document.documentElement);
    for (const name of ["surface", "surface-raised", "surface-sunken", "line", "text", "text-2", "text-3", "accent", "accent-soft",
                        "good", "warn", "bad", "ov-hover", "ov-hold", "ov-load", "ov-added", "ov-removed"]) {
      document.getElementById("colours").insertAdjacentHTML("beforeend",
        `<span class="sw"><i style="background: var(--${name})"></i>${name}<br>${css.getPropertyValue("--" + name).trim()}</span>`);
    }
    for (let i = 1; i <= 7; i++) {
      document.getElementById("spaces").insertAdjacentHTML("beforeend",
        `<span class="sw"><i style="width: var(--s-${i})"></i>${css.getPropertyValue("--s-" + i).trim()}</span>`);
    }
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup B · Guided</title>
<style>
:root {
  --bg: #fbf7f2; --panel: #fff; --text: #2a2522; --muted: #8a8079; --line: #eee5dc;
  --accent: #f0643c; --accent-soft: #ffeee7; --good: #1f9d74; --warn: #e39b00; --badc: #e0454b;
  --p-top: #f3d9c4; --p-s1: #e2b796; --p-s2: #cf9f7b; --hole: #8f6b55;
  --bad-1: #ff9a9e; --bad-2: #ec5b61; --bad-3: #cc4046; --fix: #57c9a5; --fix-2: #2fae86;
  font: 15px/1.5 "Nunito", "Segoe UI", system-ui, sans-serif; color: var(--text);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); min-height: 100vh; padding-bottom: 90px; }
button { font: inherit; cursor: pointer; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 28px; }
.logo { font-weight: 800; font-size: 19px; display: flex; gap: 10px; align-items: center; }
.logo i { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, #ff8a5b, #f0643c 60%, #ffb347); box-shadow: 0 3px 10px #f0643c55; }
#modes { margin-left: auto; display: flex; gap: 4px; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 4px #0000000d; }
.mode { border: 0; background: none; padding: 6px 16px; border-radius: 999px; color: var(--muted); font-weight: 600; }
.mode.on { background: var(--text); color: #fff; } .mode:disabled { opacity: .4; cursor: default; } .mode small { font-size: 10px; }

/* stepper across the top */
#steps { display: flex; gap: 0; margin: 4px 28px 18px; background: #fff; border-radius: 16px; padding: 8px; box-shadow: 0 1px 4px #0000000d; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.step + .step::before { content: ""; position: absolute; top: 19px; right: 50%; width: 100%; height: 2px; background: var(--line); z-index: 0; margin-right: 14px; }
.step .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #f2ebe4; z-index: 1; font-size: 13px; }
.step.now { color: var(--text); } .step.now .dot { background: var(--accent); color: #fff; box-shadow: 0 0 0 5px var(--accent-soft); }
.step.done .dot { background: #d6f3e8; color: var(--good); }
.step.old .dot { background: #fff0cc; color: var(--warn); } .step.old .name::after { content: " ↻"; color: var(--warn); }
.step.busy .dot { border: 3px solid var(--accent); border-right-color: transparent; background: #fff; animation: spin .8s linear infinite; }
.step.locked { opacity: .5; cursor: default; }

main { display: grid; grid-template-columns: 1fr 420px; gap: 20px; margin: 0 28px; align-items: start; }
#view { position: relative; background: #fff; border-radius: 22px; min-height: 520px; display: grid; place-items: center; box-shadow: 0 1px 4px #0000000d; overflow: hidden; }
#view svg { width: min(92%, 640px); }
.bed { fill: #f6efe8; } .grid polyline { stroke: #eadfd4; stroke-width: 1; fill: none; }
.empty { color: var(--muted); font-size: 17px; }
.view-label { position: absolute; left: 18px; top: 16px; background: var(--bg); padding: 4px 12px; border-radius: 999px; font-size: 12px; color: var(--muted); font-weight: 600; }
.legend { position: absolute; left: 18px; bottom: 16px; background: var(--bg); padding: 4px 12px; border-radius: 999px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.legend span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pulse { animation: pulse 1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .35; } }

#panel { background: #fff; border-radius: 22px; box-shadow: 0 1px 4px #0000000d; display: flex; flex-direction: column; }
.panel-body { padding: 24px 26px 8px; }
.panel-foot { padding: 14px 26px 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
h2 { margin: 0 0 4px; font-size: 24px; font-weight: 800; } h3 { font-size: 14px; margin: 20px 0 6px; } h3 small, label small { color: var(--muted); font-weight: 400; }
.lead { color: var(--muted); margin: 0 0 16px; }
label { display: block; font-weight: 700; font-size: 14px; margin: 16px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: #f6f0ea; border-radius: 12px; padding: 8px 14px; font-weight: 600; color: #5b524c; }
.chip.on { background: var(--text); color: #fff; }
.toggle { display: flex; gap: 10px; align-items: center; font-weight: 600; margin-top: 18px; padding: 10px 12px; background: #faf6f2; border-radius: 12px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.sub { margin: 8px 0 0 12px; font-size: 14px; color: var(--muted); }
.affects { margin-top: 20px; font-size: 13px; color: #8a6a00; padding: 10px 12px; background: #fff6dc; border-radius: 12px; }
.affects::before { content: "🔗 "; }
.more { margin-top: 14px; font-size: 14px; } .more summary { color: var(--accent); cursor: pointer; font-weight: 700; } .more p { color: var(--muted); }
.problem .more { margin-top: 4px; font-size: 13px; }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 800; box-shadow: 0 4px 14px #f0643c55; }
.primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
.primary.big { width: 100%; padding: 16px; font-size: 17px; } .panel-foot .primary.big { width: auto; flex: 1; }
.secondary { width: 100%; background: #fff; border: 2px solid var(--text); border-radius: 14px; padding: 11px; margin-top: 10px; font-weight: 700; }
.ghost { background: none; border: 0; padding: 8px 10px; color: var(--muted); font-weight: 700; } .ghost.small { font-size: 13px; padding: 2px 8px; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 700; }
.small { font-size: 13px; color: var(--muted); } .center { text-align: center; }
.drop { width: 100%; border: 3px dashed #ecd9c8; background: #fdf9f5; border-radius: 18px; padding: 44px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; color: var(--muted); }
.drop:hover { border-color: var(--accent); background: var(--accent-soft); } .drop b { color: var(--text); font-size: 17px; }
.drop::before { content: "⬆"; font-size: 28px; color: var(--accent); }
.file { display: flex; flex-direction: column; gap: 2px; padding: 14px; background: #faf6f2; border-radius: 14px; } .file span { color: var(--muted); font-size: 14px; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { text-align: left; border: 2px solid transparent; background: #faf6f2; border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 10px; font-size: 13px; color: var(--muted); }
.card b { grid-column: 1 / -1; color: var(--text); font-size: 15px; } .card.on { border-color: var(--accent); background: #fff; }
.tag { font-style: normal; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.tag.good { background: #d6f3e8; color: var(--good); } .tag.todo { background: #ffe3e4; color: var(--badc); }
.worse { color: var(--badc); } .meh { color: var(--warn); } .better { color: var(--good); }
.delta { margin-top: 12px; font-size: 14px; padding: 10px 12px; background: #fff6dc; border-radius: 12px; }
.group { margin: 18px 0 8px; font-size: 13px; font-weight: 800; } .group.fail { color: var(--badc); } .group.look { color: var(--warn); } .group.tip { color: var(--muted); }
.group.fail::before { content: "⛔ "; } .group.look::before { content: "👀 "; } .group.tip::before { content: "💡 "; }
.problem { background: #faf6f2; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; border: 2px solid transparent; }
.problem.on { border-color: var(--accent); background: #fff; }
.problem span { font-size: 14px; color: var(--muted); } .problem .tag { align-self: flex-start; }
.verdict { display: flex; flex-direction: column; padding: 18px; border-radius: 18px; background: linear-gradient(135deg, #d6f3e8, #eefaf5); margin-bottom: 6px; }
.verdict.warn { background: linear-gradient(135deg, #ffefc9, #fff8e8); } .verdict.warn b { color: #b36b00; } .verdict.warn b::before { content: "⚠ "; } .verdict.warn span { color: #6b4a10; }
.verdict b { font-size: 24px; font-weight: 800; color: var(--good); } .verdict b::before { content: "✓ "; } .verdict span { color: #2c6a54; font-size: 14px; }
.gauge { padding: 16px; border-radius: 18px; background: #faf6f2; display: flex; flex-direction: column; gap: 2px; } .gauge b { font-size: 20px; font-weight: 800; color: var(--good); } .gauge span { font-size: 14px; color: var(--muted); }
.gauge .bar { height: 10px; background: #efe5db; border-radius: 6px; margin-top: 10px; overflow: hidden; } .gauge .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), var(--warn)); }
.res { margin-top: 8px; color: var(--text); }
.effect { margin: 4px 0 0 12px; font-size: 14px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; } td { padding: 9px 4px; border-bottom: 1px solid var(--line); } td.why { color: var(--muted); font-size: 13px; }

#activity[hidden] { display: none; }
/* background work: a bar docked at the bottom, always visible */
#activity { position: fixed; left: 0; right: 0; bottom: 0; background: #2a2522; color: #fff; padding: 12px 28px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; box-shadow: 0 -6px 24px #0003; }
.act-head { display: flex; align-items: center; gap: 12px; grid-column: 1 / -1; } .act-head .time { margin-left: auto; color: #c9bfb7; font-variant-numeric: tabular-nums; font-size: 13px; }
#activity .ghost { color: #fff; border: 1px solid #ffffff44; border-radius: 999px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#activity .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: #ffffff22; margin: 6px 0; overflow: hidden; } #activity .bar i { display: block; height: 100%; background: var(--accent); transition: width .1s; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: #9c918a; }
.stages .done { color: #8fe0bf; } .stages .now { color: #fff; font-weight: 700; }
.act-aff { font-size: 13px; color: #ffd27a; justify-self: end; }

/* first visit: pick how much you want to see */
.start { position: fixed; inset: 0; background: #2a252299; display: grid; place-items: center; z-index: 20; }
.start .box { background: var(--bg); border-radius: 26px; padding: 30px; width: min(820px, 94vw); }
.start h1 { margin: 0 0 4px; font-size: 28px; } .start p { color: var(--muted); margin: 0 0 20px; }
.start .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.start button { text-align: left; border: 2px solid transparent; background: #fff; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.start button:hover { border-color: var(--accent); } .start button b { font-size: 19px; } .start button span { color: var(--muted); font-size: 14px; }
.start button i { font-style: normal; font-size: 30px; }
#toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; }
.note { position: fixed; right: 12px; top: 70px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header><div class="logo"><i></i>FDM Check</div><div id="modes"></div></header>
<nav id="steps"></nav>
<main><div id="view"></div><section id="panel"></section></main>
<div id="activity" hidden></div>
<div id="toast" hidden></div>
<div class="note">Mockup B · Guided · fake results</div>
<script>
// First visit: big choice instead of a small switch.
window.chooseMode = () => {
  const d = document.createElement("div");
  d.className = "start";
  d.innerHTML = `<div class="box"><h1>Hi! How much do you want to see?</h1><p>You can switch any time at the top.</p><div class="row">
    <button data-m="simple"><i>⚡</i><b>Simple</b><span>Pick printer and material. One click, done.</span></button>
    <button data-m="basic"><i>🧰</i><b>Basic</b><span>All choices: orientation, problems, settings.</span></button>
    <button data-m="advanced"><i>🔬</i><b>Advanced</b><span>Plus strength, shaking, knocks and design changes.</span></button></div></div>`;
  document.body.append(d);
  d.querySelectorAll("button").forEach((b) => b.onclick = () => { d.remove(); mockSetMode(b.dataset.m); });
};
</script>
<script src="mock.js"></script>
<script>startMock();</script>
</body>
</html>
